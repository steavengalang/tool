<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Generator - ToolsKita</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="../index.html" class="nav-brand">ToolsKita</a>
    </div>
  </nav>

  <main class="tool-page">
    <div class="container">
      <div class="tool-header">
        <h1>🔑 Password Generator</h1>
        <p>Generate password kuat dan aman</p>
      </div>

      <div class="tool-content">
        <div class="form-group">
          <label for="length">Password Length: <span id="lengthValue">16</span></label>
          <input type="range" id="length" min="8" max="64" value="16" oninput="updateLength()">
        </div>

        <div class="checkbox-group">
          <label><input type="checkbox" id="uppercase" checked> Uppercase (A-Z)</label>
          <label><input type="checkbox" id="lowercase" checked> Lowercase (a-z)</label>
          <label><input type="checkbox" id="numbers" checked> Numbers (0-9)</label>
          <label><input type="checkbox" id="symbols" checked> Symbols (!@#$%)</label>
        </div>

        <button class="btn" onclick="generate()">Generate Password</button>

        <div class="form-group">
          <label for="password">Generated Password:</label>
          <div class="password-display">
            <input type="text" id="password" readonly>
            <button class="btn" onclick="copyPassword()">Copy</button>
          </div>
        </div>

        <div id="strength" class="strength-meter"></div>
      </div>
    </div>
  </main>

  <script>
    function updateLength() {
      document.getElementById('lengthValue').textContent = document.getElementById('length').value;
    }

    function generate() {
      const length = parseInt(document.getElementById('length').value);
      let charset = '';
      
      if(document.getElementById('uppercase').checked) charset += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      if(document.getElementById('lowercase').checked) charset += 'abcdefghijklmnopqrstuvwxyz';
      if(document.getElementById('numbers').checked) charset += '0123456789';
      if(document.getElementById('symbols').checked) charset += '!@#$%^&*()_+-=[]{}|;:,.<>?';
      
      if(!charset) {
        alert('Pilih minimal satu opsi!');
        return;
      }
      
      let password = '';
      for(let i = 0; i < length; i++) {
        password += charset.charAt(Math.floor(Math.random() * charset.length));
      }
      
      document.getElementById('password').value = password;
      checkStrength(password);
    }

    function checkStrength(pwd) {
      let strength = 0;
      if(pwd.length >= 12) strength++;
      if(/[a-z]/.test(pwd)) strength++;
      if(/[A-Z]/.test(pwd)) strength++;
      if(/[0-9]/.test(pwd)) strength++;
      if(/[^a-zA-Z0-9]/.test(pwd)) strength++;
      
      const meter = document.getElementById('strength');
      const labels = ['Sangat Lemah', 'Lemah', 'Sedang', 'Kuat', 'Sangat Kuat'];
      const colors = ['#ff4444', '#ff8800', '#ffcc00', '#88cc00', '#00cc44'];
      
      meter.textContent = `Kekuatan: ${labels[strength - 1] || 'Sangat Lemah'}`;
      meter.style.background = colors[strength - 1] || '#ff4444';
      meter.style.padding = '1rem';
      meter.style.borderRadius = '8px';
      meter.style.marginTop = '1rem';
      meter.style.textAlign = 'center';
      meter.style.color = 'white';
      meter.style.fontWeight = 'bold';
    }

    function copyPassword() {
      const pwd = document.getElementById('password');
      pwd.select();
      document.execCommand('copy');
      alert('Password copied!');
    }

    window.onload = generate;
  </script>
</body>
</html>
