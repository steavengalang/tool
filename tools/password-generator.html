<!DOCTYPE html>
<html lang="id">
<head>
  <meta name="description" content="Password Generator - Free online tool by ToolsKita">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Generator - ToolsKita</title>
  <link rel="stylesheet" href="../css/style.css">

  <!-- tool-improved-v2 -->
  <style>
    .copy-toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: linear-gradient(135deg, #22c55e, #16a34a); color: white; padding: 12px 24px; border-radius: 12px; font-weight: 600; opacity: 0; transition: all 0.3s ease; z-index: 9999; box-shadow: 0 10px 40px rgba(34, 197, 94, 0.4); }
    .copy-toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .btn { position: relative; overflow: hidden; }
    .btn::after { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent); opacity: 0; transition: opacity 0.3s; }
    .btn:hover::after { opacity: 1; }
    .btn:active { transform: scale(0.98); }
    .form-group { margin-bottom: 1.5rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: var(--text-secondary, #a1a1a1); }
    input[type="text"], input[type="number"], textarea, select { transition: all 0.3s ease; }
    input[type="text"]:focus, input[type="number"]:focus, textarea:focus, select:focus { border-color: var(--accent, #d4ff3a) !important; box-shadow: 0 0 0 3px rgba(212, 255, 58, 0.2) !important; outline: none; }
    .password-display, .result-display { display: flex; gap: 0.5rem; align-items: stretch; }
    .password-display input, .result-display input, .result-display textarea { flex: 1; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .loading { animation: pulse 1.5s infinite; }
  </style>
  <script>
    function showToast(msg = 'Copied!') {
      let toast = document.querySelector('.copy-toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.className = 'copy-toast';
        document.body.appendChild(toast);
      }
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }
    function copyText(text) {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => showToast('Copied!')).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }
    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('Copied!');
    }
  </script>
<script src="https://quge5.com/88/tag.min.js" data-zone="198117" async data-cfasync="false"></script>
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="../index.html" class="nav-brand">ToolsKita</a>
    </div>
  </nav>

  <main class="tool-page">
    <div class="container">
      <div class="tool-header">
        <h1>🔑 Password Generator</h1>
        <p>Generate password kuat dan aman</p>
      </div>

      <div class="tool-content">
        <div class="form-group">
          <label for="length">Password Length: <span id="lengthValue">16</span></label>
          <input type="range" id="length" min="8" max="64" value="16" oninput="updateLength()">
        </div>

        <div class="checkbox-group">
          <label><input type="checkbox" id="uppercase" checked> Uppercase (A-Z)</label>
          <label><input type="checkbox" id="lowercase" checked> Lowercase (a-z)</label>
          <label><input type="checkbox" id="numbers" checked> Numbers (0-9)</label>
          <label><input type="checkbox" id="symbols" checked> Symbols (!@#$%)</label>
        </div>

        <button class="btn" onclick="generate()">Generate Password</button>

        <div class="form-group">
          <label for="password">Generated Password:</label>
          <div class="password-display">
            <input type="text" id="password" readonly>
            <button class="btn" onclick="copyPassword()">Copy</button>
          </div>
        </div>

        <div id="strength" class="strength-meter"></div>
      </div>
    </div>
  </main>

  <script>
    function updateLength() {
      document.getElementById('lengthValue').textContent = document.getElementById('length').value;
    }

    function generate() {
      const length = parseInt(document.getElementById('length').value);
      let charset = '';
      
      if(document.getElementById('uppercase').checked) charset += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      if(document.getElementById('lowercase').checked) charset += 'abcdefghijklmnopqrstuvwxyz';
      if(document.getElementById('numbers').checked) charset += '0123456789';
      if(document.getElementById('symbols').checked) charset += '!@#$%^&*()_+-=[]{}|;:,.<>?';
      
      if(!charset) {
        alert('Pilih minimal satu opsi!');
        return;
      }
      
      let password = '';
      for(let i = 0; i < length; i++) {
        password += charset.charAt(Math.floor(Math.random() * charset.length));
      }
      
      document.getElementById('password').value = password;
      checkStrength(password);
    }

    function checkStrength(pwd) {
      let strength = 0;
      if(pwd.length >= 12) strength++;
      if(/[a-z]/.test(pwd)) strength++;
      if(/[A-Z]/.test(pwd)) strength++;
      if(/[0-9]/.test(pwd)) strength++;
      if(/[^a-zA-Z0-9]/.test(pwd)) strength++;
      
      const meter = document.getElementById('strength');
      const labels = ['Sangat Lemah', 'Lemah', 'Sedang', 'Kuat', 'Sangat Kuat'];
      const colors = ['#ff4444', '#ff8800', '#ffcc00', '#88cc00', '#00cc44'];
      
      meter.textContent = `Kekuatan: ${labels[strength - 1] || 'Sangat Lemah'}`;
      meter.style.background = colors[strength - 1] || '#ff4444';
      meter.style.padding = '1rem';
      meter.style.borderRadius = '8px';
      meter.style.marginTop = '1rem';
      meter.style.textAlign = 'center';
      meter.style.color = 'white';
      meter.style.fontWeight = 'bold';
    }

    function copyPassword() {
      const pwd = document.getElementById('password');
      pwd.select();
      document.execCommand('copy');
      showToast('Copied!');
    }

    window.onload = generate;
  </script>


<!-- Ad Container -->
<div style="margin: 2rem auto; max-width: 728px; text-align: center;" id="ad-container"></div>
</body>
</html>
