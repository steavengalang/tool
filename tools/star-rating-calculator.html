<!DOCTYPE html>
<html lang="id">
<head>
  <meta name="description" content="Star Rating Calculator - Free online tool by ToolsKita">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator Peringkat Bintang - ToolsKita</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .rating-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    .rating-row label {
      min-width: 60px;
      font-size: 1.2rem;
    }
    .rating-result {
      text-align: center;
      margin-top: 2rem;
      padding: 1.5rem;
      border: 1px dashed #ddd;
      border-radius: 8px;
    }
    .rating-result p {
      margin: 0;
    }
    #averageRating {
      font-size: 3rem;
      font-weight: bold;
      color: #ffc107; /* Warna kuning bintang */
    }
    #totalVotes {
        font-size: 1rem;
        color: #666;
    }
  </style>

  <!-- tool-improved-v2 -->
  <style>
    .copy-toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: linear-gradient(135deg, #22c55e, #16a34a); color: white; padding: 12px 24px; border-radius: 12px; font-weight: 600; opacity: 0; transition: all 0.3s ease; z-index: 9999; box-shadow: 0 10px 40px rgba(34, 197, 94, 0.4); }
    .copy-toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .btn { position: relative; overflow: hidden; }
    .btn::after { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent); opacity: 0; transition: opacity 0.3s; }
    .btn:hover::after { opacity: 1; }
    .btn:active { transform: scale(0.98); }
    .form-group { margin-bottom: 1.5rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: var(--text-secondary, #a1a1a1); }
    input[type="text"], input[type="number"], textarea, select { transition: all 0.3s ease; }
    input[type="text"]:focus, input[type="number"]:focus, textarea:focus, select:focus { border-color: var(--accent, #d4ff3a) !important; box-shadow: 0 0 0 3px rgba(212, 255, 58, 0.2) !important; outline: none; }
    .password-display, .result-display { display: flex; gap: 0.5rem; align-items: stretch; }
    .password-display input, .result-display input, .result-display textarea { flex: 1; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .loading { animation: pulse 1.5s infinite; }
  </style>
  <script>
    function showToast(msg = 'Copied!') {
      let toast = document.querySelector('.copy-toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.className = 'copy-toast';
        document.body.appendChild(toast);
      }
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }
    function copyText(text) {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => showToast('Copied!')).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }
    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('Copied!');
    }
  </script>
<script src="https://quge5.com/88/tag.min.js" data-zone="198117" async data-cfasync="false"></script>
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="../index.html" class="nav-brand">ToolsKita</a>
    </div>
  </nav>

  <main class="tool-page">
    <div class="container">
      <div class="tool-header">
        <h1>⭐ Kalkulator Peringkat Bintang</h1>
        <p>Hitung skor rata-rata dari distribusi peringkat bintang 1 hingga 5.</p>
      </div>

      <div class="tool-content">
        <div class="rating-row">
          <label for="stars5">5 ★</label>
          <input type="number" id="stars5" min="0" value="100" oninput="calculateAverageRating()">
        </div>
        <div class="rating-row">
          <label for="stars4">4 ★</label>
          <input type="number" id="stars4" min="0" value="50" oninput="calculateAverageRating()">
        </div>
        <div class="rating-row">
          <label for="stars3">3 ★</label>
          <input type="number" id="stars3" min="0" value="10" oninput="calculateAverageRating()">
        </div>
        <div class="rating-row">
          <label for="stars2">2 ★</label>
          <input type="number" id="stars2" min="0" value="5" oninput="calculateAverageRating()">
        </div>
        <div class="rating-row">
          <label for="stars1">1 ★</label>
          <input type="number" id="stars1" min="0" value="2" oninput="calculateAverageRating()">
        </div>
        
        <div class="rating-result">
          <p>Peringkat Rata-rata:</p>
          <div id="averageRating">0.00</div>
          <p id="totalVotes">Total 0 suara</p>
        </div>
      </div>
    </div>
  </main>

  <script>
    function calculateAverageRating() {
      const s5 = parseInt(document.getElementById('stars5').value) || 0;
      const s4 = parseInt(document.getElementById('stars4').value) || 0;
      const s3 = parseInt(document.getElementById('stars3').value) || 0;
      const s2 = parseInt(document.getElementById('stars2').value) || 0;
      const s1 = parseInt(document.getElementById('stars1').value) || 0;
      
      const totalVotes = s1 + s2 + s3 + s4 + s5;
      const totalScore = (s5 * 5) + (s4 * 4) + (s3 * 3) + (s2 * 2) + (s1 * 1);
      
      let average = 0;
      if (totalVotes > 0) {
        average = totalScore / totalVotes;
      }
      
      document.getElementById('averageRating').textContent = average.toFixed(2);
      document.getElementById('totalVotes').textContent = `Total ${totalVotes.toLocaleString('id-ID')} suara`;
    }
    
    window.onload = calculateAverageRating;
  </script>
