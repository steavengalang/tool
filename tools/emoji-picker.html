<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emoji Picker - ToolsKita</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .emoji-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
      gap: var(--space-2);
      margin: var(--space-6) 0;
    }
    .emoji-item {
      font-size: 2rem;
      padding: var(--space-3);
      text-align: center;
      cursor: pointer;
      border-radius: var(--radius);
      transition: all var(--duration-fast) var(--ease-standard);
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
    }
    .emoji-item:hover {
      background: var(--accent-muted);
      transform: scale(1.2);
      border-color: var(--accent);
    }
    .category-tabs {
      display: flex;
      gap: var(--space-2);
      flex-wrap: wrap;
      margin-bottom: var(--space-6);
    }
    .category-tab {
      padding: var(--space-3) var(--space-5);
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-full);
      cursor: pointer;
      transition: all var(--duration-fast) var(--ease-standard);
      font-size: 0.9375rem;
      font-weight: 600;
    }
    .category-tab:hover {
      background: var(--accent-muted);
      border-color: var(--accent);
    }
    .category-tab.active {
      background: var(--accent);
      color: var(--bg-primary);
      border-color: var(--accent);
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="../index.html" class="nav-brand">ToolsKita</a>
    </div>
  </nav>

  <main class="tool-page">
    <div class="container">
      <div class="tool-header">
        <h1>😀 Emoji Picker</h1>
        <p>Copy emoji dengan satu klik</p>
      </div>

      <div class="tool-content">
        <div class="form-group">
          <label for="search">Search Emoji:</label>
          <input type="text" id="search" placeholder="Search emoji..." oninput="filterEmojis()">
        </div>

        <div class="category-tabs">
          <button class="category-tab active" onclick="showCategory('all')">All</button>
          <button class="category-tab" onclick="showCategory('faces')">😀 Faces</button>
          <button class="category-tab" onclick="showCategory('hands')">👋 Hands</button>
          <button class="category-tab" onclick="showCategory('animals')">🐶 Animals</button>
          <button class="category-tab" onclick="showCategory('food')">🍔 Food</button>
          <button class="category-tab" onclick="showCategory('travel')">✈️ Travel</button>
          <button class="category-tab" onclick="showCategory('objects')">💡 Objects</button>
          <button class="category-tab" onclick="showCategory('symbols')">❤️ Symbols</button>
        </div>

        <div class="emoji-grid" id="emojiGrid"></div>

        <div id="copiedMsg" style="position: fixed; bottom: 2rem; right: 2rem; padding: 1rem 2rem; background: var(--accent); color: var(--bg-primary); border-radius: var(--radius); font-weight: 700; display: none; box-shadow: var(--shadow-lg);">
          Emoji Copied! 🎉
        </div>
      </div>
    </div>
  </main>

    };

    let currentCategory = 'all';

    function showCategory(category) {
      currentCategory = category;
      document.querySelectorAll('.category-tab').forEach(tab => tab.classList.remove('active'));
      event.target.classList.add('active');
      renderEmojis();
    }

    function renderEmojis() {
      const grid = document.getElementById('emojiGrid');
      grid.innerHTML = '';

      let emojisToShow = [];
      if (currentCategory === 'all') {
        emojisToShow = Object.values(emojis).flat();
      } else {
        emojisToShow = emojis[currentCategory] || [];
      }

      emojisToShow.forEach(emoji => {
        const div = document.createElement('div');
        div.className = 'emoji-item';
        div.textContent = emoji;
        div.onclick = () => copyEmoji(emoji);
        grid.appendChild(div);
      });
    }

    function filterEmojis() {
      const search = document.getElementById('search').value.toLowerCase();
      const items = document.querySelectorAll('.emoji-item');
      items.forEach(item => {
        if (search === '') {
          item.style.display = 'block';
        } else {
          item.style.display = 'none';
        }
      });
    }

    function copyEmoji(emoji) {
      navigator.clipboard.writeText(emoji);
      const msg = document.getElementById('copiedMsg');
      msg.style.display = 'block';
      setTimeout(() => {
        msg.style.display = 'none';
      }, 2000);
    }

    window.onload = renderEmojis;
  </script>
</body>
</html>
