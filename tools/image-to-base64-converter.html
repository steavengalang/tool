  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image ke Base64 Converter - ToolsKita</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    #dropZone {
      border: 2px dashed #ccc;
      border-radius: 8px;
      padding: 3rem;
      text-align: center;
      cursor: pointer;
      background-color: #f9f9f9;
    }
    #dropZone.drag-over {

      border-color: #aaa;
    }
    #imagePreview {
      max-width: 100%;
      max-height: 200px;
      margin-top: 1rem;
      border-radius: 4px;
    }
    #base64Output {
      height: 150px;
      font-family: monospace;
      word-wrap: break-word;

      position: relative;
    }
    .copy-btn {
      position: absolute;
      top: 5px;
      right: 5px;
    }
  </style>

  <!-- tool-improved-v2 -->
  <style>
    .copy-toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: linear-gradient(135deg, #22c55e, #16a34a); color: white; padding: 12px 24px; border-radius: 12px; font-weight: 600; opacity: 0; transition: all 0.3s ease; z-index: 9999; box-shadow: 0 10px 40px rgba(34, 197, 94, 0.4); }
    .copy-toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .btn { position: relative; overflow: hidden; }
    .btn::after { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent); opacity: 0; transition: opacity 0.3s; }
    .btn:hover::after { opacity: 1; }
    .btn:active { transform: scale(0.98); }
    .form-group { margin-bottom: 1.5rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: var(--text-secondary, #a1a1a1); }
    input[type="text"], input[type="number"], textarea, select { transition: all 0.3s ease; }
    input[type="text"]:focus, input[type="number"]:focus, textarea:focus, select:focus { border-color: var(--accent, #d4ff3a) !important; box-shadow: 0 0 0 3px rgba(212, 255, 58, 0.2) !important; outline: none; }
    .password-display, .result-display { display: flex; gap: 0.5rem; align-items: stretch; }
    .password-display input, .result-display input, .result-display textarea { flex: 1; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .loading { animation: pulse 1.5s infinite; }
  </style>
  <script>
    function showToast(msg = 'Copied!') {
      let toast = document.querySelector('.copy-toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.className = 'copy-toast';
        document.body.appendChild(toast);
      }
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }
    function copyText(text) {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => showToast('Copied!')).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }
    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('Copied!');
    }
  </script>

</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="../index.html" class="nav-brand">ToolsKita</a>
    </div>
  </nav>

  <main class="tool-page">
    <div class="container">
      <div class="tool-header">
        <h1>🖼️ Image ke Base64 Converter</h1>
        <p>Ubah gambar menjadi format teks Base64 untuk disematkan di web.</p>
      </div>

      <div class="tool-content">
        <div id="dropZone">
          <p>Seret & lepas gambar ke sini, atau klik untuk memilih file.</p>
          <input type="file" id="fileInput" accept="image/*" style="display: none;">
        </div>
        
        <div id="previewContainer" style="text-align: center; margin-top: 1rem;"></div>

        <div class="form-group" style="margin-top: 1.5rem;">
          <label for="base64Output">Base64 String:</label>
          <div class="output-group">
            <textarea id="base64Output" readonly></textarea>
            <button class="btn copy-btn" onclick="copyResult()">Copy</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const previewContainer = document.getElementById('previewContainer');
    const base64Output = document.getElementById('base64Output');

    dropZone.onclick = () => fileInput.click();
    
    // Drag and Drop Events
    dropZone.ondragover = (event) => {
      event.preventDefault();
      dropZone.classList.add('drag-over');
    };
    dropZone.ondragleave = () => dropZone.classList.remove('drag-over');
    dropZone.ondrop = (event) => {
      event.preventDefault();
      dropZone.classList.remove('drag-over');
      const file = event.dataTransfer.files[0];
      if (file) {
        handleFile(file);
      }
    };
    fileInput.onchange = () => {
        if(fileInput.files[0]) handleFile(fileInput.files[0]);
    };

    function handleFile(file) {
      if (!file.type.startsWith('image/')) {
        alert('File harus berupa gambar!');
        return;
      }
      
      // Tampilkan pratinjau gambar
      previewContainer.innerHTML = ''; // Bersihkan pratinjau lama
      const img = document.createElement('img');
      img.id = 'imagePreview';
      img.src = URL.createObjectURL(file);
      previewContainer.appendChild(img);

      // Konversi ke Base64
      const reader = new FileReader();
      reader.onload = (e) => {
        base64Output.value = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function copyResult() {
        if (base64Output.value) {
            navigator.clipboard.writeText(base64Output.value).then(() => {
                alert('Teks Base64 berhasil disalin!');
            }, () => {
                alert('Gagal menyalin teks.');
            });
        }
    }
  </script>
