<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown to HTML - ToolsKita</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="../index.html" class="nav-brand">ToolsKita</a>
    </div>
  </nav>

  <main class="tool-page">
    <div class="container">
      <div class="tool-header">
        <h1>📄 Markdown to HTML</h1>
        <p>Convert Markdown ke HTML</p>
      </div>

      <div class="tool-content">
        <div class="form-group">
          <label for="input">Markdown Input:</label>
          <textarea id="input" rows="10" placeholder="# Heading&#10;**bold** *italic*" oninput="convert()"></textarea>
        </div>

        <div class="form-group">
          <label for="output">HTML Output:</label>
          <textarea id="output" rows="10" readonly></textarea>
        </div>
      </div>
    </div>
  </main>

  <script>
    function convert() {
      let md = document.getElementById('input').value;
      let html = md
        .replace(/^### (.*$)/gim, '<h3>$1</h3>')
        .replace(/^## (.*$)/gim, '<h2>$1</h2>')
        .replace(/^# (.*$)/gim, '<h1>$1</h1>')
        .replace(/\*\*(.*)\*\*/gim, '<b>$1</b>')
        .replace(/\*(.*)\*/gim, '<i>$1</i>')
        .replace(/!\[(.*?)\]\((.*?)\)/gim, '<img alt="$1" src="$2" />')
        .replace(/\[(.*?)\]\((.*?)\)/gim, '<a href="$2">$1</a>')
        .replace(/\n$/gim, '<br />');
      
      document.getElementById('output').value = html;
    }
  </script>
</body>
</html>
