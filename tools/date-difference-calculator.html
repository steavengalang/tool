<!DOCTYPE html>
<html lang="id">
<head>
  <meta name="description" content="Date Difference Calculator - Free online tool by ToolsKita">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator Perbedaan Tanggal - ToolsKita</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    /* Anda bisa memindahkan style ini ke style.css utama jika diinginkan */
    .date-inputs {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
      align-items: flex-end;
    }
    .results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 1rem;
      margin-top: 2rem;
      text-align: center;
    }
    .result-card {
      background-color: #f9f9f9; /* Ganti dengan warna dari tema Anda */
      padding: 1.5rem 1rem;
      border-radius: 8px;
      border: 1px solid #eee;
    }
    .result-card h3 {
      margin: 0 0 0.5rem 0;
      font-size: 2.25rem;
      color: #333; /* Ganti dengan warna dari tema Anda */
    }
    .result-card p {
      margin: 0;
      font-size: 0.9rem;
      color: #666;
    }
    #summary {
      margin-top: 2rem;
      padding: 1rem;
      font-size: 1.2rem;
      text-align: center;
      font-weight: 500;
      background-color: #f0f5ff; /* Ganti dengan warna dari tema Anda */
      border-radius: 8px;
    }
  </style>

  <!-- tool-improved-v2 -->
  <style>
    .copy-toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: linear-gradient(135deg, #22c55e, #16a34a); color: white; padding: 12px 24px; border-radius: 12px; font-weight: 600; opacity: 0; transition: all 0.3s ease; z-index: 9999; box-shadow: 0 10px 40px rgba(34, 197, 94, 0.4); }
    .copy-toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .btn { position: relative; overflow: hidden; }
    .btn::after { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent); opacity: 0; transition: opacity 0.3s; }
    .btn:hover::after { opacity: 1; }
    .btn:active { transform: scale(0.98); }
    .form-group { margin-bottom: 1.5rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: var(--text-secondary, #a1a1a1); }
    input[type="text"], input[type="number"], textarea, select { transition: all 0.3s ease; }
    input[type="text"]:focus, input[type="number"]:focus, textarea:focus, select:focus { border-color: var(--accent, #d4ff3a) !important; box-shadow: 0 0 0 3px rgba(212, 255, 58, 0.2) !important; outline: none; }
    .password-display, .result-display { display: flex; gap: 0.5rem; align-items: stretch; }
    .password-display input, .result-display input, .result-display textarea { flex: 1; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .loading { animation: pulse 1.5s infinite; }
  </style>
  <script>
    function showToast(msg = 'Copied!') {
      let toast = document.querySelector('.copy-toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.className = 'copy-toast';
        document.body.appendChild(toast);
      }
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }
    function copyText(text) {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => showToast('Copied!')).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }
    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('Copied!');
    }
  </script>
<script src="https://quge5.com/88/tag.min.js" data-zone="198117" async data-cfasync="false"></script>
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="../index.html" class="nav-brand">ToolsKita</a>
    </div>
  </nav>

  <main class="tool-page">
    <div class="container">
      <div class="tool-header">
        <h1>🗓️ Kalkulator Perbedaan Tanggal</h1>
        <p>Hitung durasi antara dua tanggal dalam tahun, bulan, minggu, dan hari.</p>
      </div>

      <div class="tool-content">
        <div class="form-group date-inputs">
          <div>
            <label for="startDate">Tanggal Mulai:</label>
            <input type="date" id="startDate" onchange="calculateDifference()">
          </div>
          <div>
            <label for="endDate">Tanggal Selesai:</label>
            <input type="date" id="endDate" onchange="calculateDifference()">
          </div>
        </div>

        <div id="summary">Silakan pilih tanggal...</div>
        <div id="results" class="results-grid"></div>
      </div>
    </div>
  </main>

  <script>
    const startDateInput = document.getElementById('startDate');
    const endDateInput = document.getElementById('endDate');
    const resultsDiv = document.getElementById('results');
    const summaryDiv = document.getElementById('summary');

    function calculateDifference() {
      const startDateVal = startDateInput.value;
      const endDateVal = endDateInput.value;

      if (!startDateVal || !endDateVal) {
        summaryDiv.innerHTML = 'Silakan pilih kedua tanggal.';
        resultsDiv.innerHTML = '';
        return;
      }
      
      const d1 = new Date(startDateVal);
      const d2 = new Date(endDateVal);

      if (d1 > d2) {
        summaryDiv.innerHTML = 'Tanggal mulai tidak boleh setelah tanggal selesai.';
        resultsDiv.innerHTML = '';
        return;
      }

      // 1. Kalkulasi durasi tepat: Tahun, Bulan, Hari
      let years = d2.getFullYear() - d1.getFullYear();
      let months = d2.getMonth() - d1.getMonth();
      let days = d2.getDate() - d1.getDate();

      if (days < 0) {
        months--;
        // Pinjam hari dari bulan sebelumnya
        const lastDayOfPrevMonth = new Date(d2.getFullYear(), d2.getMonth(), 0).getDate();
        days += lastDayOfPrevMonth;
      }

      if (months < 0) {
        years--;
        months += 12;
      }

      summaryDiv.innerHTML = `Durasi Tepat: <strong>${years}</strong> tahun, <strong>${months}</strong> bulan, dan <strong>${days}</strong> hari`;

      // 2. Kalkulasi total dalam satuan
      const diffTime = Math.abs(d2 - d1);
      const totalDays = Math.round(diffTime / (1000 * 60 * 60 * 24));
      const totalWeeks = (totalDays / 7).toFixed(1);
      const totalMonthsApprox = (totalDays / 30.4375).toFixed(1);

      resultsDiv.innerHTML = `
        <div class="result-card">
          <h3>${totalDays.toLocaleString('id-ID')}</h3>
          <p>Total Hari</p>
        </div>
        <div class="result-card">
          <h3>${parseFloat(totalWeeks).toLocaleString('id-ID')}</h3>
          <p>Total Minggu</p>
        </div>
        <div class="result-card">
          <h3>${parseFloat(totalMonthsApprox).toLocaleString('id-ID')}</h3>
          <p>Total Bulan (rata-rata)</p>
        </div>
      `;
    }

    window.onload = function() {
      const today = new Date();
      const nextWeek = new Date();
      nextWeek.setDate(today.getDate() + 7);
      
      startDateInput.value = today.toISOString().split('T')[0];
      endDateInput.value = nextWeek.toISOString().split('T')[0];
      calculateDifference();
    };
  </script>


<!-- Ad Container -->
<div style="margin: 2rem auto; max-width: 728px; text-align: center;" id="ad-container"></div>
</body>
</html>
