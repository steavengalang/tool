<!DOCTYPE html>
<html lang="id">
<head>
  <meta name="description" content="Code Beautifier - Free online tool by ToolsKita">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code Beautifier - ToolsKita</title>
  <link rel="stylesheet" href="../css/style.css">

  <!-- tool-improved-v2 -->
  <style>
    .copy-toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: linear-gradient(135deg, #22c55e, #16a34a); color: white; padding: 12px 24px; border-radius: 12px; font-weight: 600; opacity: 0; transition: all 0.3s ease; z-index: 9999; box-shadow: 0 10px 40px rgba(34, 197, 94, 0.4); }
    .copy-toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .btn { position: relative; overflow: hidden; }
    .btn::after { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent); opacity: 0; transition: opacity 0.3s; }
    .btn:hover::after { opacity: 1; }
    .btn:active { transform: scale(0.98); }
    .form-group { margin-bottom: 1.5rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: var(--text-secondary, #a1a1a1); }
    input[type="text"], input[type="number"], textarea, select { transition: all 0.3s ease; }
    input[type="text"]:focus, input[type="number"]:focus, textarea:focus, select:focus { border-color: var(--accent, #d4ff3a) !important; box-shadow: 0 0 0 3px rgba(212, 255, 58, 0.2) !important; outline: none; }
    .password-display, .result-display { display: flex; gap: 0.5rem; align-items: stretch; }
    .password-display input, .result-display input, .result-display textarea { flex: 1; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .loading { animation: pulse 1.5s infinite; }
  </style>
  <script>
    function showToast(msg = 'Copied!') {
      let toast = document.querySelector('.copy-toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.className = 'copy-toast';
        document.body.appendChild(toast);
      }
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }
    function copyText(text) {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => showToast('Copied!')).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }
    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('Copied!');
    }
  </script>
<script src="https://quge5.com/88/tag.min.js" data-zone="198117" async data-cfasync="false"></script>
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="../index.html" class="nav-brand">ToolsKita</a>
    </div>
  </nav>

  <main class="tool-page">
    <div class="container">
      <div class="tool-header">
        <h1>✨ Code Beautifier</h1>
        <p>Format & beautify HTML, CSS, JavaScript code</p>
      </div>

      <div class="tool-content">
        <div class="form-group">
          <label>Language:</label>
          <div class="button-group">
            <button class="btn btn-secondary active" onclick="setLanguage('html')">HTML</button>
            <button class="btn btn-secondary" onclick="setLanguage('css')">CSS</button>
            <button class="btn btn-secondary" onclick="setLanguage('js')">JavaScript</button>
          </div>
        </div>

        <div class="form-group">
          <label for="input">Input Code:</label>
          <textarea id="input" rows="12" placeholder="Paste your messy code here..."></textarea>
        </div>

        <button class="btn btn-primary" style="width: 100%;" onclick="beautifyCode()">
          ✨ Beautify Code
        </button>

        <div class="form-group">
          <label for="output">Formatted Output:</label>
          <textarea id="output" rows="12" readonly></textarea>
        </div>

        <button class="btn btn-secondary" style="width: 100%;" onclick="copyOutput()">
          📋 Copy Output
        </button>
      </div>
    </div>
  </main>

  <script>
    let currentLang = 'html';

    function setLanguage(lang) {
      currentLang = lang;
      document.querySelectorAll('.button-group .btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
    }

    function beautifyCode() {
      const input = document.getElementById('input').value;
      let output = '';

      try {
        if (currentLang === 'html') {
          output = beautifyHTML(input);
        } else if (currentLang === 'css') {
          output = beautifyCSS(input);
        } else if (currentLang === 'js') {
          output = beautifyJS(input);
        }
        document.getElementById('output').value = output;
      } catch (e) {
        document.getElementById('output').value = 'Error: ' + e.message;
      }
    }

    function beautifyHTML(html) {
      let formatted = '';
      let indent = 0;
      const tab = '  ';
      
      html.split(/>\s*</).forEach(node => {
        if (node.match(/^\/\w/)) indent--;
        formatted += tab.repeat(indent) + '<' + node + '>\n';
        if (node.match(/^<?\w[^>]*[^\/]$/)) indent++;
      });
      
      return formatted.substring(1, formatted.length - 2);
    }

    function beautifyCSS(css) {
      css = css.replace(/\s+/g, ' ').trim();
      css = css.replace(/\{/g, ' {\n  ');
      css = css.replace(/\}/g, '\n}\n');
      css = css.replace(/;/g, ';\n  ');
      css = css.replace(/\n\s*\n/g, '\n');
      return css.trim();
    }

    function beautifyJS(js) {
      js = js.replace(/\s+/g, ' ').trim();
      js = js.replace(/\{/g, ' {\n  ');
      js = js.replace(/\}/g, '\n}\n');
      js = js.replace(/;/g, ';\n  ');
      js = js.replace(/\n\s*\n/g, '\n');
      return js.trim();
    }

    function copyOutput() {
      const output = document.getElementById('output');
      output.select();
      document.execCommand('copy');
      event.target.textContent = '✓ Copied!';
      setTimeout(() => {
        event.target.textContent = '📋 Copy Output';
      }, 2000);
    }
  </script>
