<!DOCTYPE html>
<html lang="id">
<head>
  <meta name="description" content="Json To Csv - Free online tool by ToolsKita">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSON to CSV Converter - ToolsKita</title>
  <link rel="stylesheet" href="../css/style.css">

  <!-- tool-improved-v2 -->
  <style>
    .copy-toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: linear-gradient(135deg, #22c55e, #16a34a); color: white; padding: 12px 24px; border-radius: 12px; font-weight: 600; opacity: 0; transition: all 0.3s ease; z-index: 9999; box-shadow: 0 10px 40px rgba(34, 197, 94, 0.4); }
    .copy-toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .btn { position: relative; overflow: hidden; }
    .btn::after { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent); opacity: 0; transition: opacity 0.3s; }
    .btn:hover::after { opacity: 1; }
    .btn:active { transform: scale(0.98); }
    .form-group { margin-bottom: 1.5rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: var(--text-secondary, #a1a1a1); }
    input[type="text"], input[type="number"], textarea, select { transition: all 0.3s ease; }
    input[type="text"]:focus, input[type="number"]:focus, textarea:focus, select:focus { border-color: var(--accent, #d4ff3a) !important; box-shadow: 0 0 0 3px rgba(212, 255, 58, 0.2) !important; outline: none; }
    .password-display, .result-display { display: flex; gap: 0.5rem; align-items: stretch; }
    .password-display input, .result-display input, .result-display textarea { flex: 1; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .loading { animation: pulse 1.5s infinite; }
  </style>
  <script>
    function showToast(msg = 'Copied!') {
      let toast = document.querySelector('.copy-toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.className = 'copy-toast';
        document.body.appendChild(toast);
      }
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }
    function copyText(text) {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => showToast('Copied!')).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }
    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('Copied!');
    }
  </script>
<script src="https://quge5.com/88/tag.min.js" data-zone="198117" async data-cfasync="false"></script>
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="../index.html" class="nav-brand">ToolsKita</a>
    </div>
  </nav>

  <main class="tool-page">
    <div class="container">
      <div class="tool-header">
        <h1>📊 JSON to CSV Converter</h1>
        <p>Convert JSON data to CSV format with download</p>
      </div>

      <div class="tool-content">
        <div class="form-group">
          <label for="jsonInput">JSON Input:</label>
          <textarea id="jsonInput" rows="12" placeholder='[{"name":"John","age":30},{"name":"Jane","age":25}]'></textarea>
        </div>

        <button class="btn btn-primary" style="width: 100%;" onclick="convertToCSV()">
          🔄 Convert to CSV
        </button>

        <div class="stats-grid" id="stats" style="display: none; margin: var(--space-6) 0;">
          <div class="stat-box">
            <div class="stat-value" id="rowCount">0</div>
            <div class="stat-label">Rows</div>
          </div>
          <div class="stat-box">
            <div class="stat-value" id="colCount">0</div>
            <div class="stat-label">Columns</div>
          </div>
        </div>

        <div class="form-group">
          <label for="csvOutput">CSV Output:</label>
          <textarea id="csvOutput" rows="12" readonly></textarea>
        </div>

        <div class="button-group">
          <button class="btn btn-secondary" onclick="copyCSV()">📋 Copy CSV</button>
          <button class="btn btn-secondary" onclick="downloadCSV()">💾 Download CSV</button>
        </div>
      </div>
    </div>
  </main>

  <script>
    function convertToCSV() {
      const jsonInput = document.getElementById('jsonInput').value;
      
      try {
        const data = JSON.parse(jsonInput);
        
        if (!Array.isArray(data) || data.length === 0) {
          alert('Please enter a valid JSON array');
          return;
        }

        // Get all unique keys
        const keys = [...new Set(data.flatMap(Object.keys))];
        
        // Create CSV header
        let csv = keys.join(',') + '\n';
        
        // Add data rows
        data.forEach(row => {
          const values = keys.map(key => {
            const value = row[key] !== undefined ? row[key] : '';
            // Escape commas and quotes
            return typeof value === 'string' && (value.includes(',') || value.includes('"'))
              ? `"${value.replace(/"/g, '""')}"`
              : value;
          });
          csv += values.join(',') + '\n';
        });

        document.getElementById('csvOutput').value = csv;
        document.getElementById('rowCount').textContent = data.length;
        document.getElementById('colCount').textContent = keys.length;
        document.getElementById('stats').style.display = 'grid';
      } catch (e) {
        alert('Invalid JSON: ' + e.message);
      }
    }

    function copyCSV() {
      const csv = document.getElementById('csvOutput');
      csv.select();
      document.execCommand('copy');
      event.target.textContent = '✓ Copied!';
      setTimeout(() => {
        event.target.textContent = '📋 Copy CSV';
      }, 2000);
    }

    function downloadCSV() {
      const csv = document.getElementById('csvOutput').value;
      if (!csv) {
        alert('Please convert JSON to CSV first');
        return;
      }

      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'data.csv';
      a.click();
      URL.revokeObjectURL(url);
    }
  </script>


<!-- Ad Container -->
<div style="margin: 2rem auto; max-width: 728px; text-align: center;" id="ad-container"></div>
</body>
</html>
