    .generator-layout {

  <!-- tool-improved-v2 -->
  <style>
    .copy-toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: linear-gradient(135deg, #22c55e, #16a34a); color: white; padding: 12px 24px; border-radius: 12px; font-weight: 600; opacity: 0; transition: all 0.3s ease; z-index: 9999; box-shadow: 0 10px 40px rgba(34, 197, 94, 0.4); }
    .copy-toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .btn { position: relative; overflow: hidden; }
    .btn::after { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent); opacity: 0; transition: opacity 0.3s; }
    .btn:hover::after { opacity: 1; }
    .btn:active { transform: scale(0.98); }
    .form-group { margin-bottom: 1.5rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: var(--text-secondary, #a1a1a1); }
    input[type="text"], input[type="number"], textarea, select { transition: all 0.3s ease; }
    input[type="text"]:focus, input[type="number"]:focus, textarea:focus, select:focus { border-color: var(--accent, #d4ff3a) !important; box-shadow: 0 0 0 3px rgba(212, 255, 58, 0.2) !important; outline: none; }
    .password-display, .result-display { display: flex; gap: 0.5rem; align-items: stretch; }
    .password-display input, .result-display input, .result-display textarea { flex: 1; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .loading { animation: pulse 1.5s infinite; }
  </style>
  <script>
    function showToast(msg = 'Copied!') {
      let toast = document.querySelector('.copy-toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.className = 'copy-toast';
        document.body.appendChild(toast);
      }
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }
    function copyText(text) {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => showToast('Copied!')).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }
    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('Copied!');
    }
  </script>

<body>
  <nav class="navbar">
    <div class="container">

  <main class="tool-page">
    <div class="container">
      <div class="tool-header">
        <h1>✨ CSS clip-path Generator</h1>
        <p>Buat bentuk kustom yang keren untuk elemen web Anda secara visual.</p>
      </div>

      <div class="tool-content generator-layout">
        <div class="controls">
          <div class="form-group">
            <label for="shapeSelect">Pilih Bentuk:</label>
            <select id="shapeSelect" onchange="changeShape()">
              <option value="circle">Circle</option>
              <option value="ellipse">Ellipse</option>
              <option value="inset" selected>Inset (Rectangle)</option>
              <option value="polygon">Polygon (Triangle)</option>
            </select>
          </div>
          <hr>
          <!-- Controls for Inset -->
          <div id="insetControls" class="control-group active">
            <h4>Inset Controls</h4>
            <div class="form-group">
                <label>Top (%):</label> <input type="range" id="insetTop" min="0" max="50" value="10" oninput="updateClipPath()">
            </div>
            <div class="form-group">
                <label>Right (%):</label> <input type="range" id="insetRight" min="0" max="50" value="10" oninput="updateClipPath()">
            </div>
            <div class="form-group">
                <label>Bottom (%):</label> <input type="range" id="insetBottom" min="0" max="50" value="10" oninput="updateClipPath()">
            </div>
            <div class="form-group">
                <label>Left (%):</label> <input type="range" id="insetLeft" min="0" max="50" value="10" oninput="updateClipPath()">
            </div>
          </div>
          <!-- Other control groups would go here -->
        </div>

        <div class="preview-area">
          <div id="shapePreview"></div>
          <textarea id="resultCode" readonly></textarea>
        </div>
      </div>
    </div>
  </main>

  <script>
    const shapeSelect = document.getElementById('shapeSelect');
    const shapePreview = document.getElementById('shapePreview');
    const resultCode = document.getElementById('resultCode');

    function updateClipPath() {
        const shape = shapeSelect.value;
        let clipPathValue = '';
        
        if (shape === 'inset') {
            const top = document.getElementById('insetTop').value;
            const right = document.getElementById('insetRight').value;
            const bottom = document.getElementById('insetBottom').value;
            const left = document.getElementById('insetLeft').value;
            clipPathValue = `inset(${top}% ${right}% ${bottom}% ${left}%)`;
        }
        // Add logic for other shapes (circle, ellipse, polygon) here
        // This is a simplified example focusing on 'inset'
        
        shapePreview.style.clipPath = clipPathValue;
        resultCode.value = `clip-path: ${clipPathValue};`;
    }

    function changeShape() {
        document.querySelectorAll('.control-group').forEach(el => el.classList.remove('active'));
        const activeControls = document.getElementById(`${shapeSelect.value}Controls`);
        if (activeControls) {
            activeControls.classList.add('active');
        }
        updateClipPath();
    }

    window.onload = changeShape;
  </script>
