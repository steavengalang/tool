  <script>
    function showToast(msg = 'Copied!') {
      let toast = document.querySelector('.copy-toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.className = 'copy-toast';
        document.body.appendChild(toast);
      }
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }
    function copyText(text) {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => showToast('Copied!')).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }
    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('Copied!');
    }
  </script>

<div class="tool-content">
  <table id="storageTable"><thead><tr><th>Key</th><th>Value</th></tr></thead><tbody></tbody></table>
  <button class="btn" style="margin-top:1rem" onclick="loadStorage()">Muat Ulang</button>

<script>
function loadStorage() {
  const tableBody = document.querySelector('#storageTable tbody');
  tableBody.innerHTML = '';
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    const value = localStorage.getItem(key);
    const row = tableBody.insertRow();
    row.insertCell(0).textContent = key;
    row.insertCell(1).textContent = value;
  }
}
window.onload = loadStorage;
</script>
