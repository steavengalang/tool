<!DOCTYPE html>
<html lang="id">
<head>
  <meta name="description" content="Html Table Generator - Free online tool by ToolsKita">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Table Generator - ToolsKita</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .generator-layout { display: grid; grid-template-columns: 280px 1fr; gap: 2rem; }
    #resultCode { height: 400px; }
  </style>

  <!-- tool-improved-v2 -->
  <style>
    .copy-toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: linear-gradient(135deg, #22c55e, #16a34a); color: white; padding: 12px 24px; border-radius: 12px; font-weight: 600; opacity: 0; transition: all 0.3s ease; z-index: 9999; box-shadow: 0 10px 40px rgba(34, 197, 94, 0.4); }
    .copy-toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .btn { position: relative; overflow: hidden; }
    .btn::after { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent); opacity: 0; transition: opacity 0.3s; }
    .btn:hover::after { opacity: 1; }
    .btn:active { transform: scale(0.98); }
    .form-group { margin-bottom: 1.5rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: var(--text-secondary, #a1a1a1); }
    input[type="text"], input[type="number"], textarea, select { transition: all 0.3s ease; }
    input[type="text"]:focus, input[type="number"]:focus, textarea:focus, select:focus { border-color: var(--accent, #d4ff3a) !important; box-shadow: 0 0 0 3px rgba(212, 255, 58, 0.2) !important; outline: none; }
    .password-display, .result-display { display: flex; gap: 0.5rem; align-items: stretch; }
    .password-display input, .result-display input, .result-display textarea { flex: 1; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .loading { animation: pulse 1.5s infinite; }
  </style>
  <script>
    function showToast(msg = 'Copied!') {
      let toast = document.querySelector('.copy-toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.className = 'copy-toast';
        document.body.appendChild(toast);
      }
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }
    function copyText(text) {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => showToast('Copied!')).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }
    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('Copied!');
    }
  </script>
<script src="https://quge5.com/88/tag.min.js" data-zone="198117" async data-cfasync="false"></script>
</head>
<body>
  <nav class="navbar"><div class="container"><a href="../index.html" class="nav-brand">ToolsKita</a></div></nav>
  <main class="tool-page">
    <div class="container">
      <div class="tool-header"><h1>📝 HTML Table Generator</h1><p>Buat kode struktur tabel HTML dengan cepat dan mudah.</p></div>
      <div class="tool-content generator-layout">
        <div class="controls">
          <div class="form-group">
            <label for="rows">Jumlah Baris:</label>
            <input type="number" id="rows" value="3" min="1">
          </div>
          <div class="form-group">
            <label for="cols">Jumlah Kolom:</label>
            <input type="number" id="cols" value="4" min="1">
          </div>
          <div class="form-group">
            <label><input type="checkbox" id="hasHeader" checked> Sertakan Header Tabel (`<thead>`)</label>
          </div>
          <button class="btn" onclick="generateTable()">Generate Kode</button>
        </div>
        <div class="result-area">
          <textarea id="resultCode" readonly></textarea>
          <button class="btn" onclick="copyCode()">Copy Kode</button>
        </div>
      </div>
    </div>
  </main>
  <script>
    function generateTable() {
      const rows = parseInt(document.getElementById('rows').value);
      const cols = parseInt(document.getElementById('cols').value);
      const hasHeader = document.getElementById('hasHeader').checked;
      let code = '<table>\n';
      
      if (hasHeader) {
        code += '  <thead>\n    <tr>\n';
        for (let i = 1; i <= cols; i++) {
          code += `      <th>Header ${i}</th>\n`;
        }
        code += '    </tr>\n  </thead>\n';
      }
      
      code += '  <tbody>\n';
      for (let r = 1; r <= rows; r++) {
        code += '    <tr>\n';
        for (let c = 1; c <= cols; c++) {
          code += `      <td>Data ${r},${c}</td>\n`;
        }
        code += '    </tr>\n';
      }
      code += '  </tbody>\n</table>';
      
      document.getElementById('resultCode').value = code;
    }
    function copyCode() {
      const area = document.getElementById('resultCode');
      area.select();
      copyText(document.querySelector('input, textarea').value);
    }
    window.onload = generateTable;
  </script>


<!-- Ad Container -->
<div style="margin: 2rem auto; max-width: 728px; text-align: center;" id="ad-container"></div>
</body>
</html>
