    .copy-toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    .btn::after { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent); opacity: 0; transition: opacity 0.3s; }

  <script>
    function showToast(msg = 'Copied!') {
      let toast = document.querySelector('.copy-toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.className = 'copy-toast';
        document.body.appendChild(toast);
      }
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }
    function copyText(text) {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => showToast('Copied!')).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }
    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('Copied!');
    }
  </script>

<main class="tool-page"><div class="container">
<div class="tool-header"><h1>🔄 Case Converter</h1><p>Ubah teks ke berbagai format case.</p></div>
<div class="tool-content">
  <textarea id="textInput" style="height:200px;"></textarea>
  <button class="btn" onclick="convert('upper')">UPPERCASE</button>
  <button class="btn" onclick="convert('lower')">lowercase</button>
  <button class="btn" onclick="convert('title')">Title Case</button>
  <button class="btn" onclick="convert('camel')">camelCase</button>
  <button class="btn" onclick="convert('pascal')">PascalCase</button>
  <button class="btn" onclick="convert('kebab')">kebab-case</button>
  <button class="btn" onclick="convert('snake')">snake_case</button>
</div></div></main>
<script>
function convert(type) {
  const area = document.getElementById('textInput');
  let text = area.value;
  switch(type) {
    case 'upper': text = text.toUpperCase(); break;
    case 'lower': text = text.toLowerCase(); break;
    case 'title': text = text.replace(/\\w\\S*/g, (w) => w.charAt(0).toUpperCase() + w.substr(1).toLowerCase()); break;
    case 'camel': text = text.toLowerCase().replace(/[^a-zA-Z0-9]+(.)?/g, (m, c) => c ? c.toUpperCase() : ''); break;
    case 'pascal': text = text.replace(/(\\w)(\\w*)/g, (g0, g1, g2) => g1.toUpperCase() + g2.toLowerCase()).replace(/\\W/g, ''); break;
    case 'kebab': text = text.toLowerCase().replace(/\\s+/g, '-'); break;
    case 'snake': text = text.toLowerCase().replace(/\\s+/g, '_'); break;
  }
  area.value = text;
}
</script>
