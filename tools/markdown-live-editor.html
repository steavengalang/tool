<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown Live Editor - ToolsKita</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .editor-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; height: 60vh; }
    textarea, #preview { width: 100%; height: 100%; padding: 1rem; border: 1px solid #ccc; border-radius: 4px; }
    #preview { background-color: #fff; overflow-y: auto; }
  </style>
</head>
<body>
  <nav class="navbar"><div class="container"><a href="../index.html" class="nav-brand">ToolsKita</a></div></nav>
  <main class="tool-page">
    <div class="container">
      <div class="tool-header"><h1>✍️ Markdown Live Editor</h1><p>Tulis Markdown di kiri, lihat hasilnya langsung di kanan.</p></div>
      <div class="tool-content">
        <div class="editor-layout">
          <textarea id="markdownInput" oninput="updatePreview()" placeholder="# Ketik Markdown di sini..."></textarea>
          <div id="preview"></div>
        </div>
      </div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    const input = document.getElementById('markdownInput');
    const preview = document.getElementById('preview');
    function updatePreview() {
      preview.innerHTML = marked.parse(input.value);
    }
    input.value = `# Hello, World!\n\n- Ini adalah daftar\n- Coba tulis sesuatu...`;
    window.onload = updatePreview;
  </script>
</body>
</html>
