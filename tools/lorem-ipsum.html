<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lorem Ipsum Generator - ToolsKita</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="../index.html" class="nav-brand">ToolsKita</a>
    </div>
  </nav>

  <main class="tool-page">
    <div class="container">
      <div class="tool-header">
        <h1>📰 Lorem Ipsum Generator</h1>
        <p>Generate dummy text untuk mockup dan design</p>
      </div>

      <div class="tool-content">
        <div class="form-group">
          <label for="paragraphs">Jumlah Paragraf:</label>
          <input type="number" id="paragraphs" min="1" max="20" value="3">
        </div>

        <button class="btn" onclick="generate()">Generate Lorem Ipsum</button>

        <div class="form-group">
          <label>Result:</label>
          <div id="output" class="result-box"></div>
        </div>
      </div>
    </div>
  </main>

  <script>
    const lorem = [
      "Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.",
      "Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.",
      "Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur.",
      "Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum.",
      "Sed ut perspiciatis unde omnis iste natus error sit voluptatem accusantium doloremque laudantium.",
      "Totam rem aperiam, eaque ipsa quae ab illo inventore veritatis et quasi architecto beatae vitae dicta sunt explicabo."
    ];

    function generate() {
      const count = parseInt(document.getElementById('paragraphs').value);
      let result = '';
      
      for(let i = 0; i < count; i++) {
        const paragraph = lorem.sort(() => Math.random() - 0.5).join(' ');
        result += `<p>${paragraph}</p>`;
      }
      
      document.getElementById('output').innerHTML = result;
    }

    window.onload = generate;
  </script>
</body>
</html>
