<!DOCTYPE html>
<html lang="id">
<head>
  <meta name="description" content="Ipv4 Calculator - Free online tool by ToolsKita">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPv4 Subnet Calculator - ToolsKita</title>
  <link rel="stylesheet" href="../css/style.css">

  <!-- tool-improved-v2 -->
  <style>
    .copy-toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: linear-gradient(135deg, #22c55e, #16a34a); color: white; padding: 12px 24px; border-radius: 12px; font-weight: 600; opacity: 0; transition: all 0.3s ease; z-index: 9999; box-shadow: 0 10px 40px rgba(34, 197, 94, 0.4); }
    .copy-toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .btn { position: relative; overflow: hidden; }
    .btn::after { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent); opacity: 0; transition: opacity 0.3s; }
    .btn:hover::after { opacity: 1; }
    .btn:active { transform: scale(0.98); }
    .form-group { margin-bottom: 1.5rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: var(--text-secondary, #a1a1a1); }
    input[type="text"], input[type="number"], textarea, select { transition: all 0.3s ease; }
    input[type="text"]:focus, input[type="number"]:focus, textarea:focus, select:focus { border-color: var(--accent, #d4ff3a) !important; box-shadow: 0 0 0 3px rgba(212, 255, 58, 0.2) !important; outline: none; }
    .password-display, .result-display { display: flex; gap: 0.5rem; align-items: stretch; }
    .password-display input, .result-display input, .result-display textarea { flex: 1; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .loading { animation: pulse 1.5s infinite; }
  </style>
  <script>
    function showToast(msg = 'Copied!') {
      let toast = document.querySelector('.copy-toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.className = 'copy-toast';
        document.body.appendChild(toast);
      }
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }
    function copyText(text) {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => showToast('Copied!')).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }
    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('Copied!');
    }
  </script>
<script src="https://quge5.com/88/tag.min.js" data-zone="198117" async data-cfasync="false"></script>
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="../index.html" class="nav-brand">ToolsKita</a>
    </div>
  </nav>

  <main class="tool-page">
    <div class="container">
      <div class="tool-header">
        <h1>🌐 IPv4 Subnet Calculator</h1>
        <p>Calculate IP subnets and network information</p>
      </div>

      <div class="tool-content">
        <div class="form-group">
          <label for="ipInput">IP Address / CIDR:</label>
          <input type="text" id="ipInput" placeholder="192.168.1.0/24" oninput="calculate()">
        </div>

        <button class="btn btn-primary" style="width: 100%;" onclick="calculate()">
          🔢 Calculate
        </button>

        <div class="stats-grid" id="results" style="display: none; margin-top: var(--space-6);">
          <div class="stat-box">
            <div class="stat-value" id="networkAddr">-</div>
            <div class="stat-label">Network Address</div>
          </div>
          <div class="stat-box">
            <div class="stat-value" id="broadcastAddr">-</div>
            <div class="stat-label">Broadcast Address</div>
          </div>
          <div class="stat-box">
            <div class="stat-value" id="firstHost">-</div>
            <div class="stat-label">First Host</div>
          </div>
          <div class="stat-box">
            <div class="stat-value" id="lastHost">-</div>
            <div class="stat-label">Last Host</div>
          </div>
          <div class="stat-box">
            <div class="stat-value" id="subnetMask">-</div>
            <div class="stat-label">Subnet Mask</div>
          </div>
          <div class="stat-box">
            <div class="stat-value" id="totalHosts">-</div>
            <div class="stat-label">Total Hosts</div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    function calculate() {
      const input = document.getElementById('ipInput').value;
      const [ip, cidr] = input.split('/');
      
      if (!ip || !cidr || cidr < 0 || cidr > 32) {
        alert('Invalid IP/CIDR format. Use: 192.168.1.0/24');
        return;
      }

      const ipParts = ip.split('.').map(Number);
      if (ipParts.length !== 4 || ipParts.some(p => p < 0 || p > 255)) {
        alert('Invalid IP address');
        return;
      }

      const maskBits = parseInt(cidr);
      const mask = (0xFFFFFFFF << (32 - maskBits)) >>> 0;
      const ipNum = (ipParts[0] << 24 | ipParts[1] << 16 | ipParts[2] << 8 | ipParts[3]) >>> 0;
      
      const network = (ipNum & mask) >>> 0;
      const broadcast = (network | ~mask) >>> 0;
      const firstHost = network + 1;
      const lastHost = broadcast - 1;
      const totalHosts = Math.pow(2, 32 - maskBits) - 2;

      document.getElementById('networkAddr').textContent = numToIP(network);
      document.getElementById('broadcastAddr').textContent = numToIP(broadcast);
      document.getElementById('firstHost').textContent = numToIP(firstHost);
      document.getElementById('lastHost').textContent = numToIP(lastHost);
      document.getElementById('subnetMask').textContent = numToIP(mask);
      document.getElementById('totalHosts').textContent = totalHosts.toLocaleString();
      
      document.getElementById('results').style.display = 'grid';
    }

    function numToIP(num) {
      return [
        (num >>> 24) & 0xFF,
        (num >>> 16) & 0xFF,
        (num >>> 8) & 0xFF,
        num & 0xFF
      ].join('.');
    }
  </script>


<!-- Ad Container -->
<div style="margin: 2rem auto; max-width: 728px; text-align: center;" id="ad-container"></div>
</body>
</html>
