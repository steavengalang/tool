<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pembersih Spasi Ekstra - ToolsKita</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>textarea { height: 300px; }</style>
</head>
<body>
  <nav class="navbar"><div class="container"><a href="../index.html" class="nav-brand">ToolsKita</a></div></nav>
  <main class="tool-page">
    <div class="container">
      <div class="tool-header"><h1>🚫 Pembersih Spasi Ekstra</h1><p>Hapus spasi ganda, spasi awal/akhir, dan baris kosong.</p></div>
      <div class="tool-content">
        <textarea id="textInput"></textarea>
        <button class="btn" style="margin-top:1rem;" onclick="cleanWhitespace()">Bersihkan</button>
      </div>
    </div>
  </main>
  <script>
    function cleanWhitespace() {
      const area = document.getElementById('textInput');
      let text = area.value;
      // Hapus spasi ganda
      text = text.replace(/ +/g, ' ');
      // Hapus spasi di awal/akhir setiap baris
      text = text.split('\\n').map(line => line.trim()).join('\\n');
      // Hapus baris kosong
      text = text.replace(/\\n{2,}/g, '\\n');
      area.value = text;
    }
  </script>
</body>
</html>
