<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Box Shadow Generator - ToolsKita</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .shadow-preview {
      width: 200px;
      height: 200px;
      background: var(--accent);
      border-radius: var(--radius-lg);
      margin: var(--space-8) auto;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--bg-primary);
    }
    .preset-shadows {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: var(--space-4);
      margin: var(--space-6) 0;
    }
    .preset-shadow {
      height: 100px;
      background: var(--accent);
      border-radius: var(--radius);
      cursor: pointer;
      transition: all var(--duration-fast) var(--ease-standard);
    }
    .preset-shadow:hover {
      transform: translateY(-4px);
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="../index.html" class="nav-brand">ToolsKita</a>
    </div>
  </nav>

  <main class="tool-page">
    <div class="container">
      <div class="tool-header">
        <h1>💎 Box Shadow Generator</h1>
        <p>Create beautiful CSS box shadows with live preview</p>
      </div>

      <div class="tool-content">
        <div class="shadow-preview" id="preview">Preview</div>

        <div class="form-group">
          <label for="hOffset">Horizontal Offset: <span id="hValue">0</span>px</label>
          <input type="range" id="hOffset" min="-100" max="100" value="0" oninput="updateShadow()">
        </div>

        <div class="form-group">
          <label for="vOffset">Vertical Offset: <span id="vValue">10</span>px</label>
          <input type="range" id="vOffset" min="-100" max="100" value="10" oninput="updateShadow()">
        </div>

        <div class="form-group">
          <label for="blur">Blur Radius: <span id="blurValue">30</span>px</label>
          <input type="range" id="blur" min="0" max="100" value="30" oninput="updateShadow()">
        </div>

        <div class="form-group">
          <label for="spread">Spread Radius: <span id="spreadValue">0</span>px</label>
          <input type="range" id="spread" min="-50" max="50" value="0" oninput="updateShadow()">
        </div>

        <div class="form-group">
          <label for="shadowColor">Shadow Color:</label>
          <input type="color" id="shadowColor" value="#000000" oninput="updateShadow()">
        </div>

        <div class="form-group">
          <label for="opacity">Opacity: <span id="opacityValue">50</span>%</label>
          <input type="range" id="opacity" min="0" max="100" value="50" oninput="updateShadow()">
        </div>

        <div class="form-group">
          <label>CSS Code:</label>
          <textarea id="cssOutput" rows="3" readonly></textarea>
        </div>

        <button class="btn btn-primary" style="width: 100%;" onclick="copyCSS()">
          📋 Copy CSS
        </button>

        <h3 style="margin-top: var(--space-8); margin-bottom: var(--space-4);">Presets:</h3>
        <div class="preset-shadows">
          <div class="preset-shadow" style="box-shadow: 0 2px 8px rgba(0,0,0,0.1)" onclick="applyPreset(0,2,8,0,0.1)"></div>
          <div class="preset-shadow" style="box-shadow: 0 4px 16px rgba(0,0,0,0.15)" onclick="applyPreset(0,4,16,0,0.15)"></div>
          <div class="preset-shadow" style="box-shadow: 0 8px 32px rgba(0,0,0,0.2)" onclick="applyPreset(0,8,32,0,0.2)"></div>
          <div class="preset-shadow" style="box-shadow: 0 16px 48px rgba(0,0,0,0.3)" onclick="applyPreset(0,16,48,0,0.3)"></div>
          <div class="preset-shadow" style="box-shadow: 0 20px 60px rgba(0,0,0,0.4)" onclick="applyPreset(0,20,60,0,0.4)"></div>
          <div class="preset-shadow" style="box-shadow: 0 0 40px rgba(212,255,58,0.4)" onclick="applyPreset(0,0,40,0,0.4,'#d4ff3a')"></div>
        </div>
      </div>
    </div>
  </main>

  <script>
    function updateShadow() {
      const h = document.getElementById('hOffset').value;
      const v = document.getElementById('vOffset').value;
      const blur = document.getElementById('blur').value;
      const spread = document.getElementById('spread').value;
      const color = document.getElementById('shadowColor').value;
      const opacity = document.getElementById('opacity').value / 100;

      document.getElementById('hValue').textContent = h;
      document.getElementById('vValue').textContent = v;
      document.getElementById('blurValue').textContent = blur;
      document.getElementById('spreadValue').textContent = spread;
      document.getElementById('opacityValue').textContent = document.getElementById('opacity').value;

      const rgba = hexToRgba(color, opacity);
      const shadow = `${h}px ${v}px ${blur}px ${spread}px ${rgba}`;
      
      document.getElementById('preview').style.boxShadow = shadow;
      document.getElementById('cssOutput').value = `box-shadow: ${shadow};`;
    }

    function hexToRgba(hex, alpha) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function applyPreset(h, v, blur, spread, opacity, color = '#000000') {
      document.getElementById('hOffset').value = h;
      document.getElementById('vOffset').value = v;
      document.getElementById('blur').value = blur;
      document.getElementById('spread').value = spread;
      document.getElementById('opacity').value = opacity * 100;
      document.getElementById('shadowColor').value = color;
      updateShadow();
    }

    function copyCSS() {
      const css = document.getElementById('cssOutput');
      css.select();
      document.execCommand('copy');
      event.target.textContent = '✓ Copied!';
      setTimeout(() => {
        event.target.textContent = '📋 Copy CSS';
      }, 2000);
    }

    window.onload = updateShadow;
  </script>
</body>
</html>
