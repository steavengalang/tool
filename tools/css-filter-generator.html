<!DOCTYPE html>
<html lang="id">
<head>
  <meta name="description" content="Css Filter Generator - Free online tool by ToolsKita">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Filter Generator - ToolsKita</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .generator-layout { display: grid; grid-template-columns: 300px 1fr; gap: 2rem; }
    .controls { border-right: 1px solid #eee; padding-right: 2rem; }
    #imagePreview {
        width: 100%;
        max-width: 400px;
        transition: filter 0.2s;
    }
    #resultCode { width: 100%; margin-top: 1rem; font-family: monospace; }
  </style>

  <!-- tool-improved-v2 -->
  <style>
    .copy-toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: linear-gradient(135deg, #22c55e, #16a34a); color: white; padding: 12px 24px; border-radius: 12px; font-weight: 600; opacity: 0; transition: all 0.3s ease; z-index: 9999; box-shadow: 0 10px 40px rgba(34, 197, 94, 0.4); }
    .copy-toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .btn { position: relative; overflow: hidden; }
    .btn::after { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent); opacity: 0; transition: opacity 0.3s; }
    .btn:hover::after { opacity: 1; }
    .btn:active { transform: scale(0.98); }
    .form-group { margin-bottom: 1.5rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: var(--text-secondary, #a1a1a1); }
    input[type="text"], input[type="number"], textarea, select { transition: all 0.3s ease; }
    input[type="text"]:focus, input[type="number"]:focus, textarea:focus, select:focus { border-color: var(--accent, #d4ff3a) !important; box-shadow: 0 0 0 3px rgba(212, 255, 58, 0.2) !important; outline: none; }
    .password-display, .result-display { display: flex; gap: 0.5rem; align-items: stretch; }
    .password-display input, .result-display input, .result-display textarea { flex: 1; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .loading { animation: pulse 1.5s infinite; }
  </style>
  <script>
    function showToast(msg = 'Copied!') {
      let toast = document.querySelector('.copy-toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.className = 'copy-toast';
        document.body.appendChild(toast);
      }
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }
    function copyText(text) {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => showToast('Copied!')).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }
    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('Copied!');
    }
  </script>
<script src="https://quge5.com/88/tag.min.js" data-zone="198117" async data-cfasync="false"></script>
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="../index.html" class="nav-brand">ToolsKita</a>
    </div>
  </nav>

  <main class="tool-page">
    <div class="container">
      <div class="tool-header">
        <h1>🎨 CSS Filter Generator</h1>
        <p>Eksperimen dengan berbagai filter CSS secara visual dan dapatkan kodenya.</p>
      </div>

      <div class="tool-content generator-layout">
        <div class="controls">
          <div class="form-group">
            <label>Blur: <span id="blurValue">0</span>px</label>
            <input type="range" class="filter-control" id="blur" min="0" max="20" value="0" step="0.1">
          </div>
          <div class="form-group">
            <label>Brightness: <span id="brightnessValue">100</span>%</label>
            <input type="range" class="filter-control" id="brightness" min="0" max="200" value="100">
          </div>
          <div class="form-group">
            <label>Contrast: <span id="contrastValue">100</span>%</label>
            <input type="range" class="filter-control" id="contrast" min="0" max="200" value="100">
          </div>
          <div class="form-group">
            <label>Saturate: <span id="saturateValue">100</span>%</label>
            <input type="range" class="filter-control" id="saturate" min="0" max="200" value="100">
          </div>
           <div class="form-group">
            <label>Grayscale: <span id="grayscaleValue">0</span>%</label>
            <input type="range" class="filter-control" id="grayscale" min="0" max="100" value="0">
          </div>
          <button class="btn" onclick="resetFilters()">Reset All</button>
        </div>

        <div class="preview-area">
          <img id="imagePreview" src="https://via.placeholder.com/400x300.png?text=Contoh+Gambar" alt="Preview">
          <textarea id="resultCode" readonly></textarea>
        </div>
      </div>
    </div>
  </main>

  <script>
    const controls = document.querySelectorAll('.filter-control');
    const imagePreview = document.getElementById('imagePreview');
    const resultCode = document.getElementById('resultCode');

    const defaultValues = {
        blur: { val: 0, unit: 'px'},
        brightness: { val: 100, unit: '%'},
        contrast: { val: 100, unit: '%'},
        saturate: { val: 100, unit: '%'},
        grayscale: { val: 0, unit: '%'}
    };

    function updateFilters() {
        let filterString = '';
        controls.forEach(control => {
            const value = control.value;
            const id = control.id;
            const defaultValue = defaultValues[id].val;
            
            // Update label value
            document.getElementById(`${id}Value`).textContent = value;

            if (parseFloat(value) !== defaultValue) {
                filterString += `${id}(${value}${defaultValues[id].unit}) `;
            }
        });
        
        imagePreview.style.filter = filterString.trim();
        resultCode.value = `filter: ${filterString.trim()};`;
    }

    function resetFilters() {
        controls.forEach(control => {
            control.value = defaultValues[control.id].val;
        });
        updateFilters();
    }

    controls.forEach(control => {
        control.addEventListener('input', updateFilters);
    });

    window.onload = updateFilters;
  </script>
