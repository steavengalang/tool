<!DOCTYPE html>
<html lang="id">
<head>
  <meta name="description" content="Number System Converter - Free online tool by ToolsKita">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Konverter Sistem Bilangan - ToolsKita</title>
  <link rel="stylesheet" href="../css/style.css">

  <!-- tool-improved-v2 -->
  <style>
    .copy-toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: linear-gradient(135deg, #22c55e, #16a34a); color: white; padding: 12px 24px; border-radius: 12px; font-weight: 600; opacity: 0; transition: all 0.3s ease; z-index: 9999; box-shadow: 0 10px 40px rgba(34, 197, 94, 0.4); }
    .copy-toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .btn { position: relative; overflow: hidden; }
    .btn::after { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent); opacity: 0; transition: opacity 0.3s; }
    .btn:hover::after { opacity: 1; }
    .btn:active { transform: scale(0.98); }
    .form-group { margin-bottom: 1.5rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: var(--text-secondary, #a1a1a1); }
    input[type="text"], input[type="number"], textarea, select { transition: all 0.3s ease; }
    input[type="text"]:focus, input[type="number"]:focus, textarea:focus, select:focus { border-color: var(--accent, #d4ff3a) !important; box-shadow: 0 0 0 3px rgba(212, 255, 58, 0.2) !important; outline: none; }
    .password-display, .result-display { display: flex; gap: 0.5rem; align-items: stretch; }
    .password-display input, .result-display input, .result-display textarea { flex: 1; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .loading { animation: pulse 1.5s infinite; }
  </style>
  <script>
    function showToast(msg = 'Copied!') {
      let toast = document.querySelector('.copy-toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.className = 'copy-toast';
        document.body.appendChild(toast);
      }
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }
    function copyText(text) {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => showToast('Copied!')).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }
    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('Copied!');
    }
  </script>
<script src="https://quge5.com/88/tag.min.js" data-zone="198117" async data-cfasync="false"></script>
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="../index.html" class="nav-brand">ToolsKita</a>
    </div>
  </nav>

  <main class="tool-page">
    <div class="container">
      <div class="tool-header">
        <h1>🔢 Konverter Sistem Bilangan</h1>
        <p>Konversi antara Biner, Oktal, Desimal, dan Heksadesimal secara real-time.</p>
      </div>

      <div class="tool-content">
        <div class="form-group">
          <label for="decimal">Desimal (Base 10)</label>
          <input type="text" id="decimal" oninput="convertBase('decimal', this.value)">
        </div>
        <div class="form-group">
          <label for="binary">Biner (Base 2)</label>
          <input type="text" id="binary" oninput="convertBase('binary', this.value)">
        </div>
        <div class="form-group">
          <label for="octal">Oktal (Base 8)</label>
          <input type="text" id="octal" oninput="convertBase('octal', this.value)">
        </div>
        <div class="form-group">
          <label for="hex">Heksadesimal (Base 16)</label>
          <input type="text" id="hex" oninput="convertBase('hex', this.value.toUpperCase())">
        </div>
      </div>
    </div>
  </main>

  <script>
    const inputs = {
      decimal: document.getElementById('decimal'),
      binary: document.getElementById('binary'),
      octal: document.getElementById('octal'),
      hex: document.getElementById('hex')
    };

    const bases = {
      decimal: 10,
      binary: 2,
      octal: 8,
      hex: 16
    };

    function convertBase(sourceId, value) {
      if (value.trim() === '') {
        Object.values(inputs).forEach(input => input.value = '');
        return;
      }
      
      // Validasi input
      const validationPatterns = {
        decimal: /^[0-9]+$/,
        binary: /^[01]+$/,
        octal: /^[0-7]+$/,
        hex: /^[0-9A-F]+$/
      };

      if (!validationPatterns[sourceId].test(value)) {
        // Biarkan pengguna mengetik, jangan langsung hapus
        return;
      }

      const decimalValue = parseInt(value, bases[sourceId]);

      if (isNaN(decimalValue)) {
        return;
      }

      for (const unit in inputs) {
        if (unit !== sourceId) {
          if (decimalValue === 0) {
             inputs[unit].value = '0';
          } else {
             inputs[unit].value = decimalValue.toString(bases[unit]).toUpperCase();
          }
        }
      }
    }
  </script>


<!-- Ad Container -->
<div style="margin: 2rem auto; max-width: 728px; text-align: center;" id="ad-container"></div>
</body>
</html>
