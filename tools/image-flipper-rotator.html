<!DOCTYPE html>
<html lang="id">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Pembalik & Pemutar Gambar - ToolsKita</title><link rel="stylesheet" href="../css/style.css"><style>#canvas{max-width:100%;}</style></head>
<body>
<nav class="navbar"><div class="container"><a href="../index.html" class="nav-brand">ToolsKita</a></div></nav>
<main class="tool-page"><div class="container">
<div class="tool-header"><h1>🔄 Pembalik & Pemutar Gambar</h1><p>Balik atau putar gambar secara horizontal/vertikal.</p></div>
<div class="tool-content">
  <input type="file" id="imageLoader" accept="image/*">
  <div style="margin-top:1rem;"><button class="btn" onclick="flip('horizontal')">Balik Horizontal</button> <button class="btn" onclick="flip('vertical')">Balik Vertikal</button> <button class="btn" onclick="rotate(90)">Putar 90°</button></div>
  <canvas id="canvas" style="margin-top:1rem;"></canvas>
</div></div></main>
<script>
let img = new Image();
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
document.getElementById('imageLoader').addEventListener('change', e => {
  const reader = new FileReader();
  reader.onload = event => { img.onload = () => drawImage(); img.src = event.target.result; };
  reader.readAsDataURL(e.target.files[0]);
});
function drawImage() { canvas.width = img.width; canvas.height = img.height; ctx.drawImage(img, 0, 0); }
function flip(dir) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.save();
  if (dir === 'horizontal') { ctx.translate(canvas.width, 0); ctx.scale(-1, 1); }
  else { ctx.translate(0, canvas.height); ctx.scale(1, -1); }
  ctx.drawImage(img, 0, 0);
  ctx.restore();
  img.src = canvas.toDataURL();
}
function rotate(deg) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  [canvas.width, canvas.height] = [canvas.height, canvas.width]; // swap
  ctx.save();
  ctx.translate(canvas.width / 2, canvas.height / 2);
  ctx.rotate(deg * Math.PI / 180);
  ctx.drawImage(img, -img.width / 2, -img.height / 2);
  ctx.restore();
  img.src = canvas.toDataURL();
}
</script></body></html>
