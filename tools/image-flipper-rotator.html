  <script>
    function showToast(msg = 'Copied!') {
      let toast = document.querySelector('.copy-toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.className = 'copy-toast';
        document.body.appendChild(toast);
      }
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }
    function copyText(text) {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => showToast('Copied!')).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }
    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('Copied!');
    }
  </script>

<main class="tool-page"><div class="container">
<div class="tool-header"><h1>🔄 Pembalik & Pemutar Gambar</h1><p>Balik atau putar gambar secara horizontal/vertikal.</p></div>
<div class="tool-content">
  <input type="file" id="imageLoader" accept="image/*">
  <div style="margin-top:1rem;"><button class="btn" onclick="flip('horizontal')">Balik Horizontal</button> <button class="btn" onclick="flip('vertical')">Balik Vertikal</button> <button class="btn" onclick="rotate(90)">Putar 90°</button></div>
  <canvas id="canvas" style="margin-top:1rem;"></canvas>
</div></div></main>
<script>
let img = new Image();
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
document.getElementById('imageLoader').addEventListener('change', e => {
  const reader = new FileReader();
  reader.onload = event => { img.onload = () => drawImage(); img.src = event.target.result; };
  reader.readAsDataURL(e.target.files[0]);
});
function drawImage() { canvas.width = img.width; canvas.height = img.height; ctx.drawImage(img, 0, 0); }
function flip(dir) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.save();
  if (dir === 'horizontal') { ctx.translate(canvas.width, 0); ctx.scale(-1, 1); }
  else { ctx.translate(0, canvas.height); ctx.scale(1, -1); }
  ctx.drawImage(img, 0, 0);
  ctx.restore();
  img.src = canvas.toDataURL();
}
function rotate(deg) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  [canvas.width, canvas.height] = [canvas.height, canvas.width]; // swap
  ctx.save();
  ctx.translate(canvas.width / 2, canvas.height / 2);
  ctx.rotate(deg * Math.PI / 180);
  ctx.drawImage(img, -img.width / 2, -img.height / 2);
  ctx.restore();
  img.src = canvas.toDataURL();
}
</script>
