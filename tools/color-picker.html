<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Picker - ToolsKita</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="../index.html" class="nav-brand">ToolsKita</a>
    </div>
  </nav>

  <main class="tool-page">
    <div class="container">
      <div class="tool-header">
        <h1>🎨 Color Picker</h1>
        <p>Pick color dan convert ke berbagai format</p>
      </div>

      <div class="tool-content">
        <div class="color-picker-container" style="text-align: center; margin-bottom: 2rem;">
          <input type="color" id="colorPicker" value="#f0c952" style="width: 200px; height: 100px; border: none; cursor: pointer;">
        </div>

        <div class="color-values">
          <div class="form-group">
            <label>HEX:</label>
            <input type="text" id="hex" readonly>
          </div>
          <div class="form-group">
            <label>RGB:</label>
            <input type="text" id="rgb" readonly>
          </div>
          <div class="form-group">
            <label>HSL:</label>
            <input type="text" id="hsl" readonly>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    const picker = document.getElementById('colorPicker');
    picker.addEventListener('input', updateColors);

    function updateColors() {
      const hex = picker.value;
      document.getElementById('hex').value = hex;

      const rgb = hexToRgb(hex);
      document.getElementById('rgb').value = `rgb(${rgb.r}, ${rgb.g}, ${rgb.b})`;

      const hsl = rgbToHsl(rgb.r, rgb.g, rgb.b);
      document.getElementById('hsl').value = `hsl(${hsl.h}, ${hsl.s}%, ${hsl.l}%)`;
    }

    function hexToRgb(hex) {
      const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      return result ? {
        r: parseInt(result[1], 16),
        g: parseInt(result[2], 16),
        b: parseInt(result[3], 16)
      } : null;
    }

    function rgbToHsl(r, g, b) {
      r /= 255; g /= 255; b /= 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      let h, s, l = (max + min) / 2;

      if(max === min) {
        h = s = 0;
      } else {
        const d = max - min;
        s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
        switch(max) {
          case r: h = ((g - b) / d + (g < b ? 6 : 0)) / 6; break;
          case g: h = ((b - r) / d + 2) / 6; break;
          case b: h = ((r - g) / d + 4) / 6; break;
        }
      }

      return {
        h: Math.round(h * 360),
        s: Math.round(s * 100),
        l: Math.round(l * 100)
      };
    }

    window.onload = updateColors;
  </script>
</body>
</html>
