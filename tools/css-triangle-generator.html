<!DOCTYPE html>
<html lang="id">
<head>
  <meta name="description" content="Css Triangle Generator - Free online tool by ToolsKita">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Triangle Generator - ToolsKita</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .generator-layout { display: grid; grid-template-columns: 280px 1fr; gap: 2rem; }
    .preview-area { display: flex; align-items: center; justify-content: center; min-height: 200px; }
    #trianglePreview { width: 0; height: 0; }
  </style>

  <!-- tool-improved-v2 -->
  <style>
    .copy-toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: linear-gradient(135deg, #22c55e, #16a34a); color: white; padding: 12px 24px; border-radius: 12px; font-weight: 600; opacity: 0; transition: all 0.3s ease; z-index: 9999; box-shadow: 0 10px 40px rgba(34, 197, 94, 0.4); }
    .copy-toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .btn { position: relative; overflow: hidden; }
    .btn::after { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent); opacity: 0; transition: opacity 0.3s; }
    .btn:hover::after { opacity: 1; }
    .btn:active { transform: scale(0.98); }
    .form-group { margin-bottom: 1.5rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: var(--text-secondary, #a1a1a1); }
    input[type="text"], input[type="number"], textarea, select { transition: all 0.3s ease; }
    input[type="text"]:focus, input[type="number"]:focus, textarea:focus, select:focus { border-color: var(--accent, #d4ff3a) !important; box-shadow: 0 0 0 3px rgba(212, 255, 58, 0.2) !important; outline: none; }
    .password-display, .result-display { display: flex; gap: 0.5rem; align-items: stretch; }
    .password-display input, .result-display input, .result-display textarea { flex: 1; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .loading { animation: pulse 1.5s infinite; }
  </style>
  <script>
    function showToast(msg = 'Copied!') {
      let toast = document.querySelector('.copy-toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.className = 'copy-toast';
        document.body.appendChild(toast);
      }
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }
    function copyText(text) {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => showToast('Copied!')).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }
    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('Copied!');
    }
  </script>
<script src="https://quge5.com/88/tag.min.js" data-zone="198117" async data-cfasync="false"></script>
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="../index.html" class="nav-brand">ToolsKita</a>
    </div>
  </nav>
  <main class="tool-page">
    <div class="container">
      <div class="tool-header"><h1>🔺 CSS Triangle Generator</h1><p>Buat segitiga dengan CSS murni menggunakan trik border.</p></div>
      <div class="tool-content generator-layout">
        <div class="controls">
          <div class="form-group">
            <label for="direction">Arah:</label>
            <select id="direction" onchange="updateTriangle()"><option value="top">Top</option><option value="right">Right</option><option value="bottom" selected>Bottom</option><option value="left">Left</option></select>
          </div>
          <div class="form-group">
            <label>Ukuran (px):</label> <input type="range" id="size" min="10" max="150" value="50" oninput="updateTriangle()">
          </div>
          <div class="form-group">
            <label for="color">Warna:</label> <input type="color" id="color" value="#007bff" oninput="updateTriangle()">
          </div>
        </div>
        <div class="preview-area">
          <div id="trianglePreview"></div>
          <textarea id="resultCode" readonly style="width:100%; height: 200px; margin-top: 1rem;"></textarea>
        </div>
      </div>
    </div>
  </main>
  <script>
    const direction = document.getElementById('direction');
    const size = document.getElementById('size');
    const color = document.getElementById('color');
    const preview = document.getElementById('trianglePreview');
    const resultCode = document.getElementById('resultCode');
    function updateTriangle() {
      const s = size.value;
      const c = color.value;
      const d = direction.value;
      let style = `width: 0;\nheight: 0;\n`;
      preview.style.border = 'none'; // reset
      preview.style.borderLeft = `${s}px solid transparent`;
      preview.style.borderRight = `${s}px solid transparent`;
      preview.style.borderTop = `${s}px solid transparent`;
      preview.style.borderBottom = `${s}px solid transparent`;

      switch (d) {
        case 'top':
          preview.style.borderBottomColor = c;
          style += `border-left: ${s}px solid transparent;\nborder-right: ${s}px solid transparent;\nborder-bottom: ${s}px solid ${c};`;
          break;
        case 'right':
          preview.style.borderLeftColor = c;
          style += `border-top: ${s}px solid transparent;\nborder-bottom: ${s}px solid transparent;\nborder-left: ${s}px solid ${c};`;
          break;
        case 'bottom':
          preview.style.borderTopColor = c;
          style += `border-left: ${s}px solid transparent;\nborder-right: ${s}px solid transparent;\nborder-top: ${s}px solid ${c};`;
          break;
        case 'left':
          preview.style.borderRightColor = c;
          style += `border-top: ${s}px solid transparent;\nborder-bottom: ${s}px solid transparent;\nborder-right: ${s}px solid ${c};`;
          break;
      }
      resultCode.value = style;
    }
    window.onload = updateTriangle;
  </script>


<!-- Ad Container -->
<div style="margin: 2rem auto; max-width: 728px; text-align: center;" id="ad-container"></div>
</body>
</html>
