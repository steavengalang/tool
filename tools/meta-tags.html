<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meta Tags Generator - ToolsKita</title>
  <link rel="stylesheet" href="../css/style.css">

  <!-- tool-improved-v2 -->
  <style>
    .copy-toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: linear-gradient(135deg, #22c55e, #16a34a); color: white; padding: 12px 24px; border-radius: 12px; font-weight: 600; opacity: 0; transition: all 0.3s ease; z-index: 9999; box-shadow: 0 10px 40px rgba(34, 197, 94, 0.4); }
    .copy-toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .btn { position: relative; overflow: hidden; }
    .btn::after { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent); opacity: 0; transition: opacity 0.3s; }
    .btn:hover::after { opacity: 1; }
    .btn:active { transform: scale(0.98); }
    .form-group { margin-bottom: 1.5rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: var(--text-secondary, #a1a1a1); }
    input[type="text"], input[type="number"], textarea, select { transition: all 0.3s ease; }
    input[type="text"]:focus, input[type="number"]:focus, textarea:focus, select:focus { border-color: var(--accent, #d4ff3a) !important; box-shadow: 0 0 0 3px rgba(212, 255, 58, 0.2) !important; outline: none; }
    .password-display, .result-display { display: flex; gap: 0.5rem; align-items: stretch; }
    .password-display input, .result-display input, .result-display textarea { flex: 1; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .loading { animation: pulse 1.5s infinite; }
  </style>
  <script>
    function showToast(msg = 'Copied!') {
      let toast = document.querySelector('.copy-toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.className = 'copy-toast';
        document.body.appendChild(toast);
      }
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }
    function copyText(text) {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => showToast('Copied!')).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }
    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('Copied!');
    }
  </script>
<script src="https://quge5.com/88/tag.min.js" data-zone="198117" async data-cfasync="false"></script>
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="../index.html" class="nav-brand">ToolsKita</a>
    </div>
  </nav>

  <main class="tool-page">
    <div class="container">
      <div class="tool-header">
        <h1>🏷️ Meta Tags Generator</h1>
        <p>Generate SEO & social media meta tags</p>
      </div>

      <div class="tool-content">
        <div class="form-group">
          <label for="title">Title:</label>
          <input type="text" id="title" placeholder="ToolsKita - Modern Developer Tools" oninput="generateTags()">
        </div>

        <div class="form-group">
          <label for="description">Description:</label>
          <textarea id="description" rows="3" placeholder="Koleksi tools online terbaik untuk developer..." oninput="generateTags()"></textarea>
        </div>

        <div class="form-group">
          <label for="keywords">Keywords (comma separated):</label>
          <input type="text" id="keywords" placeholder="tools, developer, online, free" oninput="generateTags()">
        </div>

        <div class="form-group">
          <label for="url">Website URL:</label>
          <input type="text" id="url" placeholder="https://toolskita.com" oninput="generateTags()">
        </div>

        <div class="form-group">
          <label for="image">Image URL (OG Image):</label>
          <input type="text" id="image" placeholder="https://toolskita.com/og-image.jpg" oninput="generateTags()">
        </div>

        <div class="form-group">
          <label for="author">Author:</label>
          <input type="text" id="author" placeholder="Your Name" oninput="generateTags()">
        </div>

        <div class="form-group">
          <label>Meta Tags Output:</label>
          <textarea id="output" rows="20" readonly></textarea>
        </div>

        <button class="btn btn-primary" style="width: 100%;" onclick="copyTags()">
          📋 Copy All Tags
        </button>
      </div>
    </div>
  </main>

  <script>
    function generateTags() {
      const title = document.getElementById('title').value || 'Your Website Title';
      const description = document.getElementById('description').value || 'Your website description';
      const keywords = document.getElementById('keywords').value || 'keywords, here';
      const url = document.getElementById('url').value || 'https://yoursite.com';
      const image = document.getElementById('image').value || 'https://yoursite.com/image.jpg';
      const author = document.getElementById('author').value || 'Your Name';

      const tags = `<!-- Basic Meta Tags -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="${description}">
<meta name="keywords" content="${keywords}">
<meta name="author" content="${author}">
<title>${title}</title>

<!-- Open Graph / Facebook -->
<meta property="og:type" content="website">
<meta property="og:url" content="${url}">
<meta property="og:title" content="${title}">
<meta property="og:description" content="${description}">
<meta property="og:image" content="${image}">

<!-- Twitter -->
<meta property="twitter:card" content="summary_large_image">
<meta property="twitter:url" content="${url}">
<meta property="twitter:title" content="${title}">
<meta property="twitter:description" content="${description}">
<meta property="twitter:image" content="${image}">

<!-- Additional Meta Tags -->
<meta name="robots" content="index, follow">
<meta name="language" content="Indonesian">
<meta name="revisit-after" content="7 days">
<link rel="canonical" href="${url}">`;

      document.getElementById('output').value = tags;
    }

    function copyTags() {
      const output = document.getElementById('output');
      output.select();
      document.execCommand('copy');
      event.target.textContent = '✓ Copied!';
      setTimeout(() => {
        event.target.textContent = '📋 Copy All Tags';
      }, 2000);
    }

    window.onload = generateTags;
  </script>


<!-- Ad Container -->
<div style="margin: 2rem auto; max-width: 728px; text-align: center;" id="ad-container"></div>
</body>
</html>
