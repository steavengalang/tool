  <style>
    .copy-toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: linear-gradient(135deg, #22c55e, #16a34a); color: white; padding: 12px 24px; border-radius: 12px; font-weight: 600; opacity: 0; transition: all 0.3s ease; z-index: 9999; box-shadow: 0 10px 40px rgba(34, 197, 94, 0.4); }
    .copy-toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .btn { position: relative; overflow: hidden; }
    .btn::after { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent); opacity: 0; transition: opacity 0.3s; }
    .btn:hover::after { opacity: 1; }
    .btn:active { transform: scale(0.98); }
    .form-group { margin-bottom: 1.5rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: var(--text-secondary, #a1a1a1); }
    input[type="text"], input[type="number"], textarea, select { transition: all 0.3s ease; }
    input[type="text"]:focus, input[type="number"]:focus, textarea:focus, select:focus { border-color: var(--accent, #d4ff3a) !important; box-shadow: 0 0 0 3px rgba(212, 255, 58, 0.2) !important; outline: none; }
    .password-display, .result-display { display: flex; gap: 0.5rem; align-items: stretch; }
    .password-display input, .result-display input, .result-display textarea { flex: 1; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .loading { animation: pulse 1.5s infinite; }
  </style>
  <script>
    function showToast(msg = 'Copied!') {
      let toast = document.querySelector('.copy-toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.className = 'copy-toast';
        document.body.appendChild(toast);
      }
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }
    function copyText(text) {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => showToast('Copied!')).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }
    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('Copied!');
    }
  </script>
<script src="https://quge5.com/88/tag.min.js" data-zone="198117" async data-cfasync="false"></script>
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="../index.html" class="nav-brand">ToolsKita</a>
    </div>
  </nav>
  <main class="tool-page">
    <div class="container">
      <div class="tool-header">
        <h1>🖼️ Image Placeholder Generator</h1>
        <p>Buat gambar placeholder dengan ukuran dan teks kustom.</p>
      </div>
      <div class="tool-content">
        <div class="form-group">
          <label>Ukuran (lebar x tinggi):</label>
          <input type="number" id="width" value="300" oninput="generatePlaceholder()"> x 
          <input type="number" id="height" value="200" oninput="generatePlaceholder()">
        </div>
        <div class="form-group">
          <label for="bgColor">Warna Latar:</label> <input type="color" id="bgColor" value="#cccccc" oninput="generatePlaceholder()">
        </div>
        <div class="form-group">
          <label for="textColor">Warna Teks:</label> <input type="color" id="textColor" value="#888888" oninput="generatePlaceholder()">
        </div>
        <h3>Hasil Pratinjau:</h3>
        <img id="preview" src="" alt="Placeholder Preview">
        <div class="form-group" style="margin-top:1rem;">
          <label for="resultUrl">URL Gambar:</label>
          <input type="text" id="resultUrl" readonly>
          <button class="btn" onclick="copyURL()">Copy URL</button>
        </div>
      </div>
    </div>
  </main>
  <script>
    const widthInput = document.getElementById('width');
    const heightInput = document.getElementById('height');
    const bgColorInput = document.getElementById('bgColor');
    const textColorInput = document.getElementById('textColor');
    const previewImg = document.getElementById('preview');
    const resultUrlInput = document.getElementById('resultUrl');

    function generatePlaceholder() {
      const w = widthInput.value;
      const h = heightInput.value;
      const bg = bgColorInput.value.substring(1); // remove #
      const tc = textColorInput.value.substring(1);
      const text = `${w} x ${h}`;
      
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
        <rect fill="#${bg}" width="${w}" height="${h}"/>
        <text fill="#${tc}" font-family="sans-serif" font-size="20" dy="10" font-weight="bold" x="50%" y="50%" text-anchor="middle">${text}</text>
      </svg>`;
      
      // Encode SVG to be used in Data URL
      const encodedSvg = encodeURIComponent(svg)
          .replace(/'/g, '%27')
          .replace(/"/g, '%22');
      
      const dataUrl = `data:image/svg+xml,${encodedSvg}`;
      
      previewImg.src = dataUrl;
      resultUrlInput.value = dataUrl;
    }

    function copyURL() {
      resultUrlInput.select();
      copyText(document.querySelector('input, textarea').value);
    }

    window.onload = generatePlaceholder;
  </script>
