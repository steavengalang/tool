<!DOCTYPE html>
<html lang="id">
<head>
  <meta name="description" content="Aspect Ratio Calculator - Free online tool by ToolsKita">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator Rasio Aspek - ToolsKita</title>
  <link rel="stylesheet" href="../css/style.css">

  <!-- tool-improved-v2 -->
  <style>
    .copy-toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: linear-gradient(135deg, #22c55e, #16a34a); color: white; padding: 12px 24px; border-radius: 12px; font-weight: 600; opacity: 0; transition: all 0.3s ease; z-index: 9999; box-shadow: 0 10px 40px rgba(34, 197, 94, 0.4); }
    .copy-toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .btn { position: relative; overflow: hidden; }
    .btn::after { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent); opacity: 0; transition: opacity 0.3s; }
    .btn:hover::after { opacity: 1; }
    .btn:active { transform: scale(0.98); }
    .form-group { margin-bottom: 1.5rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: var(--text-secondary, #a1a1a1); }
    input[type="text"], input[type="number"], textarea, select { transition: all 0.3s ease; }
    input[type="text"]:focus, input[type="number"]:focus, textarea:focus, select:focus { border-color: var(--accent, #d4ff3a) !important; box-shadow: 0 0 0 3px rgba(212, 255, 58, 0.2) !important; outline: none; }
    .password-display, .result-display { display: flex; gap: 0.5rem; align-items: stretch; }
    .password-display input, .result-display input, .result-display textarea { flex: 1; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .loading { animation: pulse 1.5s infinite; }
  </style>
  <script>
    function showToast(msg = 'Copied!') {
      let toast = document.querySelector('.copy-toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.className = 'copy-toast';
        document.body.appendChild(toast);
      }
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }
    function copyText(text) {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => showToast('Copied!')).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }
    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('Copied!');
    }
  </script>
<script src="https://quge5.com/88/tag.min.js" data-zone="198117" async data-cfasync="false"></script>
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="../index.html" class="nav-brand">ToolsKita</a>
    </div>
  </nav>

  <main class="tool-page">
    <div class="container">
      <div class="tool-header">
        <h1>📐 Kalkulator Rasio Aspek</h1>
        <p>Hitung otomatis dimensi lebar atau tinggi berdasarkan rasio yang ditentukan.</p>
      </div>

      <div class="tool-content">
        <div class="form-group ratio-inputs">
          <div>
            <label for="ratioWidth">Rasio Lebar (W)</label>
            <input type="number" id="ratioWidth" value="16" oninput="calculateAll()">
          </div>
          <span>:</span>
          <div>
            <label for="ratioHeight">Rasio Tinggi (H)</label>
            <input type="number" id="ratioHeight" value="9" oninput="calculateAll()">
          </div>
        </div>

        <hr>

        <div class="form-group">
          <h3>Hitung Tinggi (Height) dari Lebar (Width)</h3>
          <div class="calc-row">
            <div>
              <label for="originalWidth">Jika Lebar:</label>
              <input type="number" id="originalWidth" placeholder="e.g., 1920" oninput="calculateHeightFromWidth()">
            </div>
            <span>→</span>
            <div>
              <label for="newHeight">Maka Tinggi:</label>
              <input type="text" id="newHeight" readonly>
            </div>
          </div>
        </div>

        <hr>

        <div class="form-group">
          <h3>Hitung Lebar (Width) dari Tinggi (Height)</h3>
          <div class="calc-row">
            <div>
              <label for="originalHeight">Jika Tinggi:</label>
              <input type="number" id="originalHeight" placeholder="e.g., 1080" oninput="calculateWidthFromHeight()">
            </div>
            <span>→</span>
            <div>
              <label for="newWidth">Maka Lebar:</label>
              <input type="text" id="newWidth" readonly>
            </div>
          </div>
        </div>

      </div>
    </div>
  </main>

  <script>
    const ratioW = document.getElementById('ratioWidth');
    const ratioH = document.getElementById('ratioHeight');
    const originalW = document.getElementById('originalWidth');
    const newH = document.getElementById('newHeight');
    const originalH = document.getElementById('originalHeight');
    const newW = document.getElementById('newWidth');

    function calculateHeightFromWidth() {
      const rw = parseFloat(ratioW.value);
      const rh = parseFloat(ratioH.value);
      const ow = parseFloat(originalW.value);

      if (rw > 0 && rh > 0 && ow > 0) {
        const result = (ow / rw) * rh;
        // Tampilkan 2 angka desimal jika perlu, atau angka bulat
        newH.value = Number.isInteger(result) ? result : result.toFixed(2);
      } else {
        newH.value = '';
      }
    }

    function calculateWidthFromHeight() {
      const rw = parseFloat(ratioW.value);
      const rh = parseFloat(ratioH.value);
      const oh = parseFloat(originalH.value);

      if (rw > 0 && rh > 0 && oh > 0) {
        const result = (oh / rh) * rw;
        newW.value = Number.isInteger(result) ? result : result.toFixed(2);
      } else {
        newW.value = '';
      }
    }

    function calculateAll() {
      calculateHeightFromWidth();
      calculateWidthFromHeight();
    }
    
    // Panggil fungsi kalkulasi saat halaman dimuat untuk inisialisasi
    window.onload = calculateAll;
  </script>
