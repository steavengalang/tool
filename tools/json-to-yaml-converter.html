<!DOCTYPE html>
<html lang="id">
<head>
  <meta name="description" content="Json To Yaml Converter - Free online tool by ToolsKita">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Konverter JSON ke YAML - ToolsKita</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .converter-container {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1.5rem;
    }
    textarea {
        height: 300px;
        font-family: monospace;
    }
    .error-message {
        color: #dc3545;
        font-size: 0.9rem;
        margin-top: 0.5rem;
    }
    @media (min-width: 768px) {
      .converter-container {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>

  <!-- tool-improved-v2 -->
  <style>
    .copy-toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: linear-gradient(135deg, #22c55e, #16a34a); color: white; padding: 12px 24px; border-radius: 12px; font-weight: 600; opacity: 0; transition: all 0.3s ease; z-index: 9999; box-shadow: 0 10px 40px rgba(34, 197, 94, 0.4); }
    .copy-toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .btn { position: relative; overflow: hidden; }
    .btn::after { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent); opacity: 0; transition: opacity 0.3s; }
    .btn:hover::after { opacity: 1; }
    .btn:active { transform: scale(0.98); }
    .form-group { margin-bottom: 1.5rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: var(--text-secondary, #a1a1a1); }
    input[type="text"], input[type="number"], textarea, select { transition: all 0.3s ease; }
    input[type="text"]:focus, input[type="number"]:focus, textarea:focus, select:focus { border-color: var(--accent, #d4ff3a) !important; box-shadow: 0 0 0 3px rgba(212, 255, 58, 0.2) !important; outline: none; }
    .password-display, .result-display { display: flex; gap: 0.5rem; align-items: stretch; }
    .password-display input, .result-display input, .result-display textarea { flex: 1; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .loading { animation: pulse 1.5s infinite; }
  </style>
  <script>
    function showToast(msg = 'Copied!') {
      let toast = document.querySelector('.copy-toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.className = 'copy-toast';
        document.body.appendChild(toast);
      }
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }
    function copyText(text) {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => showToast('Copied!')).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }
    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('Copied!');
    }
  </script>
<script src="https://quge5.com/88/tag.min.js" data-zone="198117" async data-cfasync="false"></script>
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="../index.html" class="nav-brand">ToolsKita</a>
    </div>
  </nav>

  <main class="tool-page">
    <div class="container">
      <div class="tool-header">
        <h1>🔄 Konverter JSON ke YAML</h1>
        <p>Ubah data JSON menjadi format YAML yang lebih mudah dibaca.</p>
      </div>

      <div class="tool-content converter-container">
        <div class="form-group">
          <label for="jsonInput">Input JSON:</label>
          <textarea id="jsonInput" placeholder='{ "nama": "Budi", "umur": 25, "aktif": true }' oninput="convertJsonToYaml()"></textarea>
          <div id="jsonError" class="error-message"></div>
        </div>
        <div class="form-group">
          <label for="yamlOutput">Output YAML:</label>
          <textarea id="yamlOutput" readonly></textarea>
        </div>
      </div>
    </div>
  </main>

  <!-- Tambahkan pustaka js-yaml melalui CDN -->
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
  <script>
    const jsonInput = document.getElementById('jsonInput');
    const yamlOutput = document.getElementById('yamlOutput');
    const jsonError = document.getElementById('jsonError');

    function convertJsonToYaml() {
      const jsonStr = jsonInput.value;
      if (jsonStr.trim() === '') {
        yamlOutput.value = '';
        jsonError.textContent = '';
        return;
      }

      try {
        const jsonObj = JSON.parse(jsonStr);
        // Konversi objek JSON ke string YAML menggunakan pustaka js-yaml
        const yamlStr = jsyaml.dump(jsonObj);
        yamlOutput.value = yamlStr;
        jsonError.textContent = '';
      } catch (e) {
        yamlOutput.value = 'Error pada input JSON...';
        jsonError.textContent = e.message;
      }
    }
    
    // Inisialisasi dengan contoh
    window.onload = convertJsonToYaml;
  </script>


<!-- Ad Container -->
<div style="margin: 2rem auto; max-width: 728px; text-align: center;" id="ad-container"></div>
</body>
</html>
