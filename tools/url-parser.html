<!DOCTYPE html>
<html lang="id">
<head>
  <meta name="description" content="Url Parser - Free online tool by ToolsKita">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Parser - ToolsKita</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .result-table { width: 100%; margin-top: 1.5rem; border-collapse: collapse; }
    .result-table td { border: 1px solid #ddd; padding: 8px; font-family: monospace; }
    .result-table td:first-child { background-color: #f8f9fa; font-weight: bold; width: 120px; }
  </style>

  <!-- tool-improved-v2 -->
  <style>
    .copy-toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: linear-gradient(135deg, #22c55e, #16a34a); color: white; padding: 12px 24px; border-radius: 12px; font-weight: 600; opacity: 0; transition: all 0.3s ease; z-index: 9999; box-shadow: 0 10px 40px rgba(34, 197, 94, 0.4); }
    .copy-toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .btn { position: relative; overflow: hidden; }
    .btn::after { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent); opacity: 0; transition: opacity 0.3s; }
    .btn:hover::after { opacity: 1; }
    .btn:active { transform: scale(0.98); }
    .form-group { margin-bottom: 1.5rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: var(--text-secondary, #a1a1a1); }
    input[type="text"], input[type="number"], textarea, select { transition: all 0.3s ease; }
    input[type="text"]:focus, input[type="number"]:focus, textarea:focus, select:focus { border-color: var(--accent, #d4ff3a) !important; box-shadow: 0 0 0 3px rgba(212, 255, 58, 0.2) !important; outline: none; }
    .password-display, .result-display { display: flex; gap: 0.5rem; align-items: stretch; }
    .password-display input, .result-display input, .result-display textarea { flex: 1; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .loading { animation: pulse 1.5s infinite; }
  </style>
  <script>
    function showToast(msg = 'Copied!') {
      let toast = document.querySelector('.copy-toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.className = 'copy-toast';
        document.body.appendChild(toast);
      }
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }
    function copyText(text) {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => showToast('Copied!')).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }
    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('Copied!');
    }
  </script>
<script src="https://quge5.com/88/tag.min.js" data-zone="198117" async data-cfasync="false"></script>
</head>
<body>
  <nav class="navbar"><div class="container"><a href="../index.html" class="nav-brand">ToolsKita</a></div></nav>
  <main class="tool-page">
    <div class="container">
      <div class="tool-header"><h1>🔗 URL Parser</h1><p>Pecah URL menjadi komponen-komponennya: protokol, host, path, dll.</p></div>
      <div class="tool-content">
        <input type="text" id="urlInput" placeholder="https://toolskita.vercel.app/path?query=1" oninput="parseURL()">
        <table class="result-table">
          <tbody>
            <tr><td>Protocol</td><td id="protocol"></td></tr>
            <tr><td>Hostname</td><td id="hostname"></td></tr>
            <tr><td>Port</td><td id="port"></td></tr>
            <tr><td>Pathname</td><td id="pathname"></td></tr>
            <tr><td>Search</td><td id="search"></td></tr>
            <tr><td>Hash</td><td id="hash"></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
  <script>
    function parseURL() {
      const urlInput = document.getElementById('urlInput').value;
      try {
        const url = new URL(urlInput);
        document.getElementById('protocol').textContent = url.protocol;
        document.getElementById('hostname').textContent = url.hostname;
        document.getElementById('port').textContent = url.port;
        document.getElementById('pathname').textContent = url.pathname;
        document.getElementById('search').textContent = url.search;
        document.getElementById('hash').textContent = url.hash;
      } catch (e) {
        // Kosongkan jika URL tidak valid
        document.getElementById('protocol').textContent = '';
        document.getElementById('hostname').textContent = '';
        document.getElementById('port').textContent = '';
        document.getElementById('pathname').textContent = '';
        document.getElementById('search').textContent = '';
        document.getElementById('hash').textContent = '';
      }
    }
  </script>


<!-- Ad Container -->
<div style="margin: 2rem auto; max-width: 728px; text-align: center;" id="ad-container"></div>
</body>
</html>
