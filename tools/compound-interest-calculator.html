<!DOCTYPE html>
<html lang="id">
<head>
  <meta name="description" content="Compound Interest Calculator - Free online tool by ToolsKita">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator Bunga Majemuk - ToolsKita</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .results-compound {
      text-align: center;
      margin-top: 2rem;
      padding: 1.5rem;
      border: 1px solid #ddd;
      border-radius: 8px;
    }
    .results-compound h3 {
      margin-top: 0;
      color: #666;
      font-weight: 500;
    }
    #futureValue {
      font-size: 2.5rem;
      font-weight: bold;
      color: #007bff;
      margin-bottom: 0.5rem;
    }
    #totalInterest {
        font-size: 1.2rem;
        color: #28a745;
    }
  </style>

  <!-- tool-improved-v2 -->
  <style>
    .copy-toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: linear-gradient(135deg, #22c55e, #16a34a); color: white; padding: 12px 24px; border-radius: 12px; font-weight: 600; opacity: 0; transition: all 0.3s ease; z-index: 9999; box-shadow: 0 10px 40px rgba(34, 197, 94, 0.4); }
    .copy-toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .btn { position: relative; overflow: hidden; }
    .btn::after { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent); opacity: 0; transition: opacity 0.3s; }
    .btn:hover::after { opacity: 1; }
    .btn:active { transform: scale(0.98); }
    .form-group { margin-bottom: 1.5rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: var(--text-secondary, #a1a1a1); }
    input[type="text"], input[type="number"], textarea, select { transition: all 0.3s ease; }
    input[type="text"]:focus, input[type="number"]:focus, textarea:focus, select:focus { border-color: var(--accent, #d4ff3a) !important; box-shadow: 0 0 0 3px rgba(212, 255, 58, 0.2) !important; outline: none; }
    .password-display, .result-display { display: flex; gap: 0.5rem; align-items: stretch; }
    .password-display input, .result-display input, .result-display textarea { flex: 1; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .loading { animation: pulse 1.5s infinite; }
  </style>
  <script>
    function showToast(msg = 'Copied!') {
      let toast = document.querySelector('.copy-toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.className = 'copy-toast';
        document.body.appendChild(toast);
      }
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }
    function copyText(text) {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => showToast('Copied!')).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }
    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('Copied!');
    }
  </script>
<script src="https://quge5.com/88/tag.min.js" data-zone="198117" async data-cfasync="false"></script>
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="../index.html" class="nav-brand">ToolsKita</a>
    </div>
  </nav>

  <main class="tool-page">
    <div class="container">
      <div class="tool-header">
        <h1>📈 Kalkulator Bunga Majemuk</h1>
        <p>Proyeksikan pertumbuhan investasi Anda dengan kekuatan bunga majemuk.</p>
      </div>

      <div class="tool-content">
        <div class="form-group">
          <label for="principal">Modal Awal (Rp):</label>
          <input type="number" id="principal" placeholder="10000000" oninput="calculateCompoundInterest()">
        </div>

        <div class="form-group">
          <label for="rate">Tingkat Bunga Tahunan (%):</label>
          <input type="number" id="rate" placeholder="e.g., 7" oninput="calculateCompoundInterest()">
        </div>

        <div class="form-group">
          <label for="years">Jangka Waktu (Tahun):</label>
          <input type="number" id="years" placeholder="e.g., 10" oninput="calculateCompoundInterest()">
        </div>
        
        <div class="form-group">
          <label for="compounding">Frekuensi Bunga Majemuk:</label>
          <select id="compounding" onchange="calculateCompoundInterest()">
            <option value="1">Tahunan</option>
            <option value="2">Per Semester</option>
            <option value="4">Per Kuartal</option>
            <option value="12" selected>Bulanan</option>
          </select>
        </div>

        <div class="results-compound">
          <h3>Nilai Masa Depan:</h3>
          <p id="futureValue">Rp 0</p>
          <p id="totalInterest">Total Bunga: Rp 0</p>
        </div>
      </div>
    </div>
  </main>

  <script>
    const principalInput = document.getElementById('principal');
    const rateInput = document.getElementById('rate');
    const yearsInput = document.getElementById('years');
    const compoundingInput = document.getElementById('compounding');
    
    const futureValueOutput = document.getElementById('futureValue');
    const totalInterestOutput = document.getElementById('totalInterest');

    function formatCurrency(value) {
      if (isNaN(value) || value === 0) return 'Rp 0';
      return 'Rp ' + Math.round(value).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    }

    function calculateCompoundInterest() {
      const P = parseFloat(principalInput.value) || 0;
      const r = (parseFloat(rateInput.value) || 0) / 100;
      const t = parseFloat(yearsInput.value) || 0;
      const n = parseInt(compoundingInput.value) || 1;

      let futureValue = P;
      let totalInterest = 0;

      if (P > 0 && r > 0 && t > 0) {
        // Rumus Bunga Majemuk: A = P(1 + r/n)^(nt)
        futureValue = P * Math.pow(1 + r / n, n * t);
        totalInterest = futureValue - P;
      }
      
      futureValueOutput.textContent = formatCurrency(futureValue);
      totalInterestOutput.textContent = `Total Bunga: ${formatCurrency(totalInterest)}`;
    }
    
    window.onload = calculateCompoundInterest;
  </script>


<!-- Ad Container -->
<div style="margin: 2rem auto; max-width: 728px; text-align: center;" id="ad-container"></div>
</body>
</html>
