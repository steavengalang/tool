<!DOCTYPE html>
<html lang="id">
<head>
  <meta name="description" content="Css Transform Playground - Free online tool by ToolsKita">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Transform Playground - ToolsKita</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .generator-layout { display: grid; grid-template-columns: 300px 1fr; gap: 2rem; }
    .preview-area { display: flex; align-items: center; justify-content: center; background-color: #f8f9fa; border: 1px dashed #ccc; min-height: 300px;}
    #previewBox { width: 100px; height: 100px; background-color: #007bff; transition: transform 0.3s ease; }
  </style>

  <!-- tool-improved-v2 -->
  <style>
    .copy-toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: linear-gradient(135deg, #22c55e, #16a34a); color: white; padding: 12px 24px; border-radius: 12px; font-weight: 600; opacity: 0; transition: all 0.3s ease; z-index: 9999; box-shadow: 0 10px 40px rgba(34, 197, 94, 0.4); }
    .copy-toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .btn { position: relative; overflow: hidden; }
    .btn::after { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent); opacity: 0; transition: opacity 0.3s; }
    .btn:hover::after { opacity: 1; }
    .btn:active { transform: scale(0.98); }
    .form-group { margin-bottom: 1.5rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: var(--text-secondary, #a1a1a1); }
    input[type="text"], input[type="number"], textarea, select { transition: all 0.3s ease; }
    input[type="text"]:focus, input[type="number"]:focus, textarea:focus, select:focus { border-color: var(--accent, #d4ff3a) !important; box-shadow: 0 0 0 3px rgba(212, 255, 58, 0.2) !important; outline: none; }
    .password-display, .result-display { display: flex; gap: 0.5rem; align-items: stretch; }
    .password-display input, .result-display input, .result-display textarea { flex: 1; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .loading { animation: pulse 1.5s infinite; }
  </style>
  <script>
    function showToast(msg = 'Copied!') {
      let toast = document.querySelector('.copy-toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.className = 'copy-toast';
        document.body.appendChild(toast);
      }
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }
    function copyText(text) {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => showToast('Copied!')).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }
    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('Copied!');
    }
  </script>
<script src="https://quge5.com/88/tag.min.js" data-zone="198117" async data-cfasync="false"></script>
</head>
<body>
  <nav class="navbar"><div class="container"><a href="../index.html" class="nav-brand">ToolsKita</a></div></nav>
  <main class="tool-page">
    <div class="container">
      <div class="tool-header"><h1>🔲 CSS Transform Playground</h1><p>Eksperimen dengan scale, rotate, skew, dan translate CSS.</p></div>
      <div class="tool-content generator-layout">
        <div class="controls">
          <div class="form-group"><label>Scale:</label><input type="range" id="scale" min="0.5" max="2" value="1" step="0.1" oninput="applyTransform()"></div>
          <div class="form-group"><label>Rotate (deg):</label><input type="range" id="rotate" min="0" max="360" value="0" oninput="applyTransform()"></div>
          <div class="form-group"><label>Translate X (px):</label><input type="range" id="translateX" min="-100" max="100" value="0" oninput="applyTransform()"></div>
          <div class="form-group"><label>Translate Y (px):</label><input type="range" id="translateY" min="-100" max="100" value="0" oninput="applyTransform()"></div>
          <div class="form-group"><label>Skew X (deg):</label><input type="range" id="skewX" min="-45" max="45" value="0" oninput="applyTransform()"></div>
        </div>
        <div class="preview-area">
          <div id="previewBox"></div>
        </div>
      </div>
      <textarea id="resultCode" readonly style="width:100%; margin-top: 1rem;"></textarea>
    </div>
  </main>
  <script>
    function applyTransform() {
      const scale = document.getElementById('scale').value;
      const rotate = document.getElementById('rotate').value;
      const translateX = document.getElementById('translateX').value;
      const translateY = document.getElementById('translateY').value;
      const skewX = document.getElementById('skewX').value;
      
      const transformValue = `
        scale(${scale}) 
        rotate(${rotate}deg) 
        translateX(${translateX}px) 
        translateY(${translateY}px) 
        skewX(${skewX}deg)
      `.trim().replace(/\\s+/g, ' ');
      
      document.getElementById('previewBox').style.transform = transformValue;
      document.getElementById('resultCode').value = `transform: ${transformValue};`;
    }
    window.onload = applyTransform;
  </script>


<!-- Ad Container -->
<div style="margin: 2rem auto; max-width: 728px; text-align: center;" id="ad-container"></div>
</body>
</html>
