<!DOCTYPE html>
<html lang="id">
<head>
  <meta name="description" content="Time Unit Converter - Free online tool by ToolsKita">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Konverter Satuan Waktu - ToolsKita</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .converter-row {
        display: flex;
        align-items: center;
        gap: 1rem;
    }
    .converter-row input {
        flex-grow: 1;
    }
  </style>

  <!-- tool-improved-v2 -->
  <style>
    .copy-toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: linear-gradient(135deg, #22c55e, #16a34a); color: white; padding: 12px 24px; border-radius: 12px; font-weight: 600; opacity: 0; transition: all 0.3s ease; z-index: 9999; box-shadow: 0 10px 40px rgba(34, 197, 94, 0.4); }
    .copy-toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .btn { position: relative; overflow: hidden; }
    .btn::after { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent); opacity: 0; transition: opacity 0.3s; }
    .btn:hover::after { opacity: 1; }
    .btn:active { transform: scale(0.98); }
    .form-group { margin-bottom: 1.5rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: var(--text-secondary, #a1a1a1); }
    input[type="text"], input[type="number"], textarea, select { transition: all 0.3s ease; }
    input[type="text"]:focus, input[type="number"]:focus, textarea:focus, select:focus { border-color: var(--accent, #d4ff3a) !important; box-shadow: 0 0 0 3px rgba(212, 255, 58, 0.2) !important; outline: none; }
    .password-display, .result-display { display: flex; gap: 0.5rem; align-items: stretch; }
    .password-display input, .result-display input, .result-display textarea { flex: 1; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .loading { animation: pulse 1.5s infinite; }
  </style>
  <script>
    function showToast(msg = 'Copied!') {
      let toast = document.querySelector('.copy-toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.className = 'copy-toast';
        document.body.appendChild(toast);
      }
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }
    function copyText(text) {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => showToast('Copied!')).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }
    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('Copied!');
    }
  </script>
<script src="https://quge5.com/88/tag.min.js" data-zone="198117" async data-cfasync="false"></script>
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="../index.html" class="nav-brand">ToolsKita</a>
    </div>
  </nav>

  <main class="tool-page">
    <div class="container">
      <div class="tool-header">
        <h1>⏱️ Konverter Satuan Waktu</h1>
        <p>Konversi nilai antar satuan waktu: detik, menit, jam, hari, minggu.</p>
      </div>

      <div class="tool-content">
        <div class="form-group converter-row">
            <input type="number" id="weeks" oninput="convertTime(this.id, this.value)">
            <label for="weeks">Minggu</label>
        </div>
        <div class="form-group converter-row">
            <input type="number" id="days" oninput="convertTime(this.id, this.value)">
            <label for="days">Hari</label>
        </div>
        <div class="form-group converter-row">
            <input type="number" id="hours" oninput="convertTime(this.id, this.value)">
            <label for="hours">Jam</label>
        </div>
        <div class="form-group converter-row">
            <input type="number" id="minutes" oninput="convertTime(this.id, this.value)">
            <label for="minutes">Menit</label>
        </div>
        <div class="form-group converter-row">
            <input type="number" id="seconds" oninput="convertTime(this.id, this.value)">
            <label for="seconds">Detik</label>
        </div>
      </div>
    </div>
  </main>

  <script>
    const inputs = {
        weeks: document.getElementById('weeks'),
        days: document.getElementById('days'),
        hours: document.getElementById('hours'),
        minutes: document.getElementById('minutes'),
        seconds: document.getElementById('seconds')
    };

    const factors = {
        weeks: 604800,
        days: 86400,
        hours: 3600,
        minutes: 60,
        seconds: 1
    };

    function convertTime(sourceId, value) {
        if (value === '') {
            Object.values(inputs).forEach(input => input.value = '');
            return;
        }

        const valueInSeconds = parseFloat(value) * factors[sourceId];

        for (const unit in inputs) {
            if (unit !== sourceId) {
                const result = valueInSeconds / factors[unit];
                // Tampilkan hasil dengan presisi yang wajar
                inputs[unit].value = parseFloat(result.toPrecision(6));
            }
        }
    }
  </script>


<!-- Ad Container -->
<div style="margin: 2rem auto; max-width: 728px; text-align: center;" id="ad-container"></div>
</body>
</html>
