<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Unit Converter - ToolsKita</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="../index.html" class="nav-brand">ToolsKita</a>
    </div>
  </nav>

  <main class="tool-page">
    <div class="container">
      <div class="tool-header">
        <h1>📏 CSS Unit Converter</h1>
        <p>Convert between px, rem, em, %, vw, vh</p>
      </div>

      <div class="tool-content">
        <!-- Base Font Size -->
        <div class="form-group">
          <label for="baseFontSize">Base Font Size (default browser: 16px)</label>
          <input type="number" id="baseFontSize" value="16" oninput="convertUnits()">
        </div>

        <!-- Input Value -->
        <div class="form-group">
          <label for="inputValue">Input Value:</label>
          <div style="display: flex; gap: var(--space-3);">
            <input type="number" id="inputValue" value="16" oninput="convertUnits()" style="flex: 1;">
            <select id="inputUnit" onchange="convertUnits()" style="width: 120px;">
              <option value="px">px</option>
              <option value="rem">rem</option>
              <option value="em">em</option>
              <option value="pt">pt</option>
            </select>
          </div>
        </div>

        <!-- Results -->
        <div class="stats-grid">
          <div class="stat-box">
            <div class="stat-value" id="pxResult">16</div>
            <div class="stat-label">Pixels (px)</div>
          </div>
          <div class="stat-box">
            <div class="stat-value" id="remResult">1</div>
            <div class="stat-label">Root EM (rem)</div>
          </div>
          <div class="stat-box">
            <div class="stat-value" id="emResult">1</div>
            <div class="stat-label">EM (em)</div>
          </div>
          <div class="stat-box">
            <div class="stat-value" id="ptResult">12</div>
            <div class="stat-label">Points (pt)</div>
          </div>
        </div>

        <!-- Common Values -->
        <h3 style="margin-top: var(--space-8); margin-bottom: var(--space-4);">Common Values:</h3>
        <div style="display: grid; gap: var(--space-3);">
          <div style="display: flex; justify-content: space-between; padding: var(--space-3); background: var(--glass-bg); border-radius: var(--radius); border: 1px solid var(--glass-border);">
            <span>Small Text</span>
            <span style="color: var(--accent);">0.875rem (14px)</span>
          </div>
          <div style="display: flex; justify-content: space-between; padding: var(--space-3); background: var(--glass-bg); border-radius: var(--radius); border: 1px solid var(--glass-border);">
            <span>Body Text</span>
            <span style="color: var(--accent);">1rem (16px)</span>
          </div>
          <div style="display: flex; justify-content: space-between; padding: var(--space-3); background: var(--glass-bg); border-radius: var(--radius); border: 1px solid var(--glass-border);">
            <span>H1 Heading</span>
            <span style="color: var(--accent);">2.5rem (40px)</span>
          </div>
          <div style="display: flex; justify-content: space-between; padding: var(--space-3); background: var(--glass-bg); border-radius: var(--radius); border: 1px solid var(--glass-border);">
            <span>H2 Heading</span>
            <span style="color: var(--accent);">2rem (32px)</span>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    function convertUnits() {
      const baseFontSize = parseFloat(document.getElementById('baseFontSize').value) || 16;
      const inputValue = parseFloat(document.getElementById('inputValue').value) || 0;
      const inputUnit = document.getElementById('inputUnit').value;

      let pxValue = 0;

      // Convert to px first
      switch(inputUnit) {
        case 'px':
          pxValue = inputValue;
          break;
        case 'rem':
          pxValue = inputValue * baseFontSize;
          break;
        case 'em':
          pxValue = inputValue * baseFontSize;
          break;
        case 'pt':
          pxValue = inputValue * 1.333333;
          break;
      }

      // Convert from px to other units
      const remValue = pxValue / baseFontSize;
      const emValue = pxValue / baseFontSize;
      const ptValue = pxValue * 0.75;

      // Update display
      document.getElementById('pxResult').textContent = pxValue.toFixed(2);
      document.getElementById('remResult').textContent = remValue.toFixed(4);
      document.getElementById('emResult').textContent = emValue.toFixed(4);
      document.getElementById('ptResult').textContent = ptValue.toFixed(2);
    }

    window.onload = convertUnits;
  </script>
</body>
</html>
