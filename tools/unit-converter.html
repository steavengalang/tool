  <!-- tool-improved-v2 -->
  <style>
    .copy-toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: linear-gradient(135deg, #22c55e, #16a34a); color: white; padding: 12px 24px; border-radius: 12px; font-weight: 600; opacity: 0; transition: all 0.3s ease; z-index: 9999; box-shadow: 0 10px 40px rgba(34, 197, 94, 0.4); }
    .copy-toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .btn { position: relative; overflow: hidden; }
    .btn::after { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent); opacity: 0; transition: opacity 0.3s; }
    .btn:hover::after { opacity: 1; }
    .btn:active { transform: scale(0.98); }
    .form-group { margin-bottom: 1.5rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: var(--text-secondary, #a1a1a1); }
    input[type="text"], input[type="number"], textarea, select { transition: all 0.3s ease; }
    input[type="text"]:focus, input[type="number"]:focus, textarea:focus, select:focus { border-color: var(--accent, #d4ff3a) !important; box-shadow: 0 0 0 3px rgba(212, 255, 58, 0.2) !important; outline: none; }
    .password-display, .result-display { display: flex; gap: 0.5rem; align-items: stretch; }
    .password-display input, .result-display input, .result-display textarea { flex: 1; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .loading { animation: pulse 1.5s infinite; }
  </style>
  <script>
    function showToast(msg = 'Copied!') {
      let toast = document.querySelector('.copy-toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.className = 'copy-toast';
        document.body.appendChild(toast);
      }
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }
    function copyText(text) {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => showToast('Copied!')).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }
    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('Copied!');
    }
  </script>
<script src="https://quge5.com/88/tag.min.js" data-zone="198117" async data-cfasync="false"></script>
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="../index.html" class="nav-brand">ToolsKita</a>
    </div>
  </nav>

  <main class="tool-page">
    <div class="container">
      <div class="tool-header">
        <h1>📏 CSS Unit Converter</h1>
        <p>Convert between px, rem, em, %, vw, vh</p>
      </div>

      <div class="tool-content">
        <!-- Base Font Size -->
        <div class="form-group">
          <label for="baseFontSize">Base Font Size (default browser: 16px)</label>
          <input type="number" id="baseFontSize" value="16" oninput="convertUnits()">
        </div>

        <!-- Input Value -->
        <div class="form-group">
          <label for="inputValue">Input Value:</label>
          <div style="display: flex; gap: var(--space-3);">
            <input type="number" id="inputValue" value="16" oninput="convertUnits()" style="flex: 1;">
            <select id="inputUnit" onchange="convertUnits()" style="width: 120px;">
              <option value="px">px</option>
              <option value="rem">rem</option>
              <option value="em">em</option>
              <option value="pt">pt</option>
            </select>
          </div>
        </div>

        <!-- Results -->
        <div class="stats-grid">
          <div class="stat-box">
            <div class="stat-value" id="pxResult">16</div>
            <div class="stat-label">Pixels (px)</div>
          </div>
          <div class="stat-box">
            <div class="stat-value" id="remResult">1</div>
            <div class="stat-label">Root EM (rem)</div>
          </div>
          <div class="stat-box">
            <div class="stat-value" id="emResult">1</div>
            <div class="stat-label">EM (em)</div>
          </div>
          <div class="stat-box">
            <div class="stat-value" id="ptResult">12</div>
            <div class="stat-label">Points (pt)</div>
          </div>
        </div>

        <!-- Common Values -->
        <h3 style="margin-top: var(--space-8); margin-bottom: var(--space-4);">Common Values:</h3>
        <div style="display: grid; gap: var(--space-3);">
          <div style="display: flex; justify-content: space-between; padding: var(--space-3); background: var(--glass-bg); border-radius: var(--radius); border: 1px solid var(--glass-border);">
            <span>Small Text</span>
            <span style="color: var(--accent);">0.875rem (14px)</span>
          </div>
          <div style="display: flex; justify-content: space-between; padding: var(--space-3); background: var(--glass-bg); border-radius: var(--radius); border: 1px solid var(--glass-border);">
            <span>Body Text</span>
            <span style="color: var(--accent);">1rem (16px)</span>
          </div>
          <div style="display: flex; justify-content: space-between; padding: var(--space-3); background: var(--glass-bg); border-radius: var(--radius); border: 1px solid var(--glass-border);">
            <span>H1 Heading</span>
            <span style="color: var(--accent);">2.5rem (40px)</span>
          </div>
          <div style="display: flex; justify-content: space-between; padding: var(--space-3); background: var(--glass-bg); border-radius: var(--radius); border: 1px solid var(--glass-border);">
            <span>H2 Heading</span>
            <span style="color: var(--accent);">2rem (32px)</span>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    function convertUnits() {
      const baseFontSize = parseFloat(document.getElementById('baseFontSize').value) || 16;
      const inputValue = parseFloat(document.getElementById('inputValue').value) || 0;
      const inputUnit = document.getElementById('inputUnit').value;

      let pxValue = 0;

      // Convert to px first
      switch(inputUnit) {
        case 'px':
          pxValue = inputValue;
          break;
        case 'rem':
          pxValue = inputValue * baseFontSize;
          break;
        case 'em':
          pxValue = inputValue * baseFontSize;
          break;
        case 'pt':
          pxValue = inputValue * 1.333333;
          break;
      }

      // Convert from px to other units
      const remValue = pxValue / baseFontSize;
      const emValue = pxValue / baseFontSize;
      const ptValue = pxValue * 0.75;

      // Update display
      document.getElementById('pxResult').textContent = pxValue.toFixed(2);
      document.getElementById('remResult').textContent = remValue.toFixed(4);
      document.getElementById('emResult').textContent = emValue.toFixed(4);
      document.getElementById('ptResult').textContent = ptValue.toFixed(2);
    }

    window.onload = convertUnits;
  </script>
