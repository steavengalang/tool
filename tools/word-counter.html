<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Word Counter - ToolsKita</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="../index.html" class="nav-brand">ToolsKita</a>
    </div>
  </nav>

  <main class="tool-page">
    <div class="container">
      <div class="tool-header">
        <h1>📝 Word Counter</h1>
        <p>Hitung jumlah kata, karakter, kalimat, dan paragraf secara instant</p>
      </div>

      <div class="tool-content">
        <div class="form-group">
          <label for="textInput">Masukkan Teks:</label>
          <textarea id="textInput" rows="10" placeholder="Ketik atau paste teks di sini..."></textarea>
        </div>

        <div class="stats-grid">
          <div class="stat-box">
            <div class="stat-value" id="wordCount">0</div>
            <div class="stat-label">Words</div>
          </div>
          <div class="stat-box">
            <div class="stat-value" id="charCount">0</div>
            <div class="stat-label">Characters</div>
          </div>
          <div class="stat-box">
            <div class="stat-value" id="sentenceCount">0</div>
            <div class="stat-label">Sentences</div>
          </div>
          <div class="stat-box">
            <div class="stat-value" id="paraCount">0</div>
            <div class="stat-label">Paragraphs</div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    const textInput = document.getElementById('textInput');
    textInput.addEventListener('input', updateStats);

    function updateStats() {
      const text = textInput.value;
      document.getElementById('charCount').textContent = text.length;
      document.getElementById('wordCount').textContent = text.trim() ? text.trim().split(/\s+/).length : 0;
      document.getElementById('sentenceCount').textContent = text.split(/[.!?]+/).filter(s => s.trim().length > 0).length;
      document.getElementById('paraCount').textContent = text.split(/\n+/).filter(p => p.trim().length > 0).length;
    }
  </script>
</body>
</html>
