<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UUID Generator - ToolsKita</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="../index.html" class="nav-brand">ToolsKita</a>
    </div>
  </nav>

  <main class="tool-page">
    <div class="container">
      <div class="tool-header">
        <h1>🆔 UUID Generator</h1>
        <p>Generate unique identifier (UUID v4)</p>
      </div>

      <div class="tool-content">
        <button class="btn" onclick="generate()">Generate UUID</button>

        <div class="form-group">
          <label>Generated UUID:</label>
          <div class="password-display">
            <input type="text" id="uuid" readonly>
            <button class="btn" onclick="copyUUID()">Copy</button>
          </div>
        </div>

        <div class="form-group">
          <label>Generate Multiple:</label>
          <input type="number" id="count" min="1" max="100" value="5">
          <button class="btn" onclick="generateMultiple()">Generate</button>
        </div>

        <div class="form-group">
          <textarea id="multiple" rows="10" readonly></textarea>
        </div>
      </div>
    </div>
  </main>

  <script>
    function generateUUID() {
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
        const r = Math.random() * 16 | 0;
        const v = c === 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
      });
    }

    function generate() {
      document.getElementById('uuid').value = generateUUID();
    }

    function generateMultiple() {
      const count = parseInt(document.getElementById('count').value);
      let result = '';
      for(let i = 0; i < count; i++) {
        result += generateUUID() + '\n';
      }
      document.getElementById('multiple').value = result;
    }

    function copyUUID() {
      const uuid = document.getElementById('uuid');
      uuid.select();
      document.execCommand('copy');
      alert('UUID copied!');
    }

    window.onload = generate;
  </script>
</body>
</html>
