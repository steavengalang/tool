<!DOCTYPE html>
<html lang="id">
<head>
  <meta name="description" content="Discount Calculator - Free online tool by ToolsKita">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator Diskon - ToolsKita</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .result-display {
      margin-top: 2rem;
      padding: 1.5rem;
      background-color: #f0fff0; /* Warna hijau muda untuk hasil */
      border: 1px solid #cce8cc;
      border-radius: 8px;
    }
    .result-display p {
      margin: 0.5rem 0;
      font-size: 1.2rem;
    }
    .result-display p span {
      font-weight: bold;
      color: #007bff; /* Warna biru untuk nilai */
    }
    #finalPrice {
      font-size: 1.8rem;
      color: #28a745; /* Warna hijau untuk harga akhir */
    }
  </style>

  <!-- tool-improved-v2 -->
  <style>
    .copy-toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: linear-gradient(135deg, #22c55e, #16a34a); color: white; padding: 12px 24px; border-radius: 12px; font-weight: 600; opacity: 0; transition: all 0.3s ease; z-index: 9999; box-shadow: 0 10px 40px rgba(34, 197, 94, 0.4); }
    .copy-toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .btn { position: relative; overflow: hidden; }
    .btn::after { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent); opacity: 0; transition: opacity 0.3s; }
    .btn:hover::after { opacity: 1; }
    .btn:active { transform: scale(0.98); }
    .form-group { margin-bottom: 1.5rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: var(--text-secondary, #a1a1a1); }
    input[type="text"], input[type="number"], textarea, select { transition: all 0.3s ease; }
    input[type="text"]:focus, input[type="number"]:focus, textarea:focus, select:focus { border-color: var(--accent, #d4ff3a) !important; box-shadow: 0 0 0 3px rgba(212, 255, 58, 0.2) !important; outline: none; }
    .password-display, .result-display { display: flex; gap: 0.5rem; align-items: stretch; }
    .password-display input, .result-display input, .result-display textarea { flex: 1; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .loading { animation: pulse 1.5s infinite; }
  </style>
  <script>
    function showToast(msg = 'Copied!') {
      let toast = document.querySelector('.copy-toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.className = 'copy-toast';
        document.body.appendChild(toast);
      }
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }
    function copyText(text) {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => showToast('Copied!')).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }
    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('Copied!');
    }
  </script>
<script src="https://quge5.com/88/tag.min.js" data-zone="198117" async data-cfasync="false"></script>
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="../index.html" class="nav-brand">ToolsKita</a>
    </div>
  </nav>

  <main class="tool-page">
    <div class="container">
      <div class="tool-header">
        <h1>✂️ Kalkulator Diskon</h1>
        <p>Hitung harga akhir setelah potongan diskon dan lihat berapa yang Anda hemat.</p>
      </div>

      <div class="tool-content">
        <div class="form-group">
          <label for="originalPrice">Harga Asli (Rp):</label>
          <input type="number" id="originalPrice" placeholder="e.g., 500000" oninput="calculateDiscount()">
        </div>

        <div class="form-group">
          <label for="discountPercentage">Persentase Diskon (%):</label>
          <input type="number" id="discountPercentage" placeholder="e.g., 25" oninput="calculateDiscount()">
        </div>

        <div id="results" class="result-display">
          <p>Anda Hemat: <span id="amountSaved">Rp 0</span></p>
          <p>Harga Akhir: <span id="finalPrice">Rp 0</span></p>
        </div>
      </div>
    </div>
  </main>

  <script>
    const originalPriceInput = document.getElementById('originalPrice');
    const discountPercentageInput = document.getElementById('discountPercentage');
    const amountSavedOutput = document.getElementById('amountSaved');
    const finalPriceOutput = document.getElementById('finalPrice');

    function formatCurrency(value) {
      if (isNaN(value) || value === 0) return 'Rp 0';
      // Format ke format Rupiah tanpa desimal
      return 'Rp ' + Math.round(value).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    }

    function calculateDiscount() {
      const price = parseFloat(originalPriceInput.value) || 0;
      const discount = parseFloat(discountPercentageInput.value) || 0;

      let saved = 0;
      let finalPrice = price;

      if (price > 0 && discount > 0) {
        if (discount > 100) {
           discountPercentageInput.value = 100; // Batasi diskon maksimal 100%
        }
        saved = price * (discount / 100);
        finalPrice = price - saved;
      }
      
      amountSavedOutput.textContent = formatCurrency(saved);
      finalPriceOutput.textContent = formatCurrency(finalPrice);
    }
    
    window.onload = calculateDiscount;
  </script>


<!-- Ad Container -->
<div style="margin: 2rem auto; max-width: 728px; text-align: center;" id="ad-container"></div>
</body>
</html>
