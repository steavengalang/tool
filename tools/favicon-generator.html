<!DOCTYPE html>
<html lang="id">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Generator Favicon - ToolsKita</title><link rel="stylesheet" href="../css/style.css"></head>
<body>
<nav class="navbar"><div class="container"><a href="../index.html" class="nav-brand">ToolsKita</a></div></nav>
<main class="tool-page"><div class="container">
<div class="tool-header"><h1>⭐ Generator Favicon</h1><p>Ubah gambar menjadi ikon 16x16 atau 32x32.</p></div>
<div class="tool-content">
  <input type="file" id="imageLoader" accept="image/*">
  <div id="results" style="margin-top:1rem;"></div>
</div></div></main>
<script>
document.getElementById('imageLoader').addEventListener('change', e => {
  const reader = new FileReader();
  reader.onload = event => {
    const img = new Image();
    img.onload = () => {
      document.getElementById('results').innerHTML = `
        <a href="${resize(img, 16)}" download="favicon-16x16.png"><img src="${resize(img, 16)}"> 16x16</a><br>
        <a href="${resize(img, 32)}" download="favicon-32x32.png"><img src="${resize(img, 32)}"> 32x32</a>`;
    };
    img.src = event.target.result;
  };
  reader.readAsDataURL(e.target.files[0]);
});
function resize(img, size) {
  const canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  canvas.getContext('2d').drawImage(img, 0, 0, size, size);
  return canvas.toDataURL('image/png');
}
</script></body></html>
