<!DOCTYPE html>
<html lang="id">
<head>
  <meta name="description" content="Regex Tester - Free online tool by ToolsKita">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Regex Tester - ToolsKita</title>
  <link rel="stylesheet" href="../css/style.css">

  <!-- tool-improved-v2 -->
  <style>
    .copy-toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: linear-gradient(135deg, #22c55e, #16a34a); color: white; padding: 12px 24px; border-radius: 12px; font-weight: 600; opacity: 0; transition: all 0.3s ease; z-index: 9999; box-shadow: 0 10px 40px rgba(34, 197, 94, 0.4); }
    .copy-toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .btn { position: relative; overflow: hidden; }
    .btn::after { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent); opacity: 0; transition: opacity 0.3s; }
    .btn:hover::after { opacity: 1; }
    .btn:active { transform: scale(0.98); }
    .form-group { margin-bottom: 1.5rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: var(--text-secondary, #a1a1a1); }
    input[type="text"], input[type="number"], textarea, select { transition: all 0.3s ease; }
    input[type="text"]:focus, input[type="number"]:focus, textarea:focus, select:focus { border-color: var(--accent, #d4ff3a) !important; box-shadow: 0 0 0 3px rgba(212, 255, 58, 0.2) !important; outline: none; }
    .password-display, .result-display { display: flex; gap: 0.5rem; align-items: stretch; }
    .password-display input, .result-display input, .result-display textarea { flex: 1; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .loading { animation: pulse 1.5s infinite; }
  </style>
  <script>
    function showToast(msg = 'Copied!') {
      let toast = document.querySelector('.copy-toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.className = 'copy-toast';
        document.body.appendChild(toast);
      }
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }
    function copyText(text) {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => showToast('Copied!')).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }
    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('Copied!');
    }
  </script>
<script src="https://quge5.com/88/tag.min.js" data-zone="198117" async data-cfasync="false"></script>
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="../index.html" class="nav-brand">ToolsKita</a>
    </div>
  </nav>

  <main class="tool-page">
    <div class="container">
      <div class="tool-header">
        <h1>.* Regex Tester</h1>
        <p>Test dan debug regular expression patterns</p>
      </div>

      <div class="tool-content">
        <div class="form-group">
          <label for="pattern">Regex Pattern:</label>
          <input type="text" id="pattern" placeholder="\d{3}-\d{2}-\d{4}">
        </div>

        <div class="form-group">
          <label>Flags:</label>
          <div class="checkbox-group">
            <label><input type="checkbox" id="flagG" checked> g (global)</label>
            <label><input type="checkbox" id="flagI"> i (case-insensitive)</label>
            <label><input type="checkbox" id="flagM"> m (multiline)</label>
          </div>
        </div>

        <div class="form-group">
          <label for="text">Test Text:</label>
          <textarea id="text" rows="8" placeholder="Enter text to test..."></textarea>
        </div>

        <button class="btn" onclick="testRegex()">Test Regex</button>

        <div class="form-group">
          <label>Matches:</label>
          <div id="matches" class="result-box"></div>
        </div>
      </div>
    </div>
  </main>

  <script>
    function testRegex() {
      const pattern = document.getElementById('pattern').value;
      const text = document.getElementById('text').value;
      
      if(!pattern) {
        alert('Masukkan regex pattern!');
        return;
      }

      let flags = '';
      if(document.getElementById('flagG').checked) flags += 'g';
      if(document.getElementById('flagI').checked) flags += 'i';
      if(document.getElementById('flagM').checked) flags += 'm';

      try {
        const regex = new RegExp(pattern, flags);
        const matches = text.match(regex);
        
        if(matches && matches.length > 0) {
          document.getElementById('matches').innerHTML = 
            `<strong>Found ${matches.length} match(es):</strong><br><br>` +
            matches.map((m, i) => `${i + 1}. "${m}"`).join('<br>');
        } else {
          document.getElementById('matches').textContent = 'No matches found';
        }
      } catch(e) {
        document.getElementById('matches').textContent = 'Error: ' + e.message;
      }
    }
  </script>


<!-- Ad Container -->
<div style="margin: 2rem auto; max-width: 728px; text-align: center;" id="ad-container"></div>
</body>
</html>
