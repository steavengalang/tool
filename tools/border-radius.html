<!DOCTYPE html>
<html lang="id">
<head>
  <meta name="description" content="Border Radius - Free online tool by ToolsKita">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Border Radius Generator - ToolsKita</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .radius-preview {
      width: 300px;
      height: 300px;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      margin: var(--space-8) auto;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: 700;
      color: var(--bg-primary);
      box-shadow: var(--shadow-xl);
    }
    .corner-controls {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: var(--space-6);
      margin: var(--space-8) 0;
      position: relative;
    }
    .corner-controls::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 2px;
      height: 100%;
      background: var(--glass-border);
    }
    .corner-controls::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      height: 2px;
      background: var(--glass-border);
    }
  </style>

  <!-- tool-improved-v2 -->
  <style>
    .copy-toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: linear-gradient(135deg, #22c55e, #16a34a); color: white; padding: 12px 24px; border-radius: 12px; font-weight: 600; opacity: 0; transition: all 0.3s ease; z-index: 9999; box-shadow: 0 10px 40px rgba(34, 197, 94, 0.4); }
    .copy-toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .btn { position: relative; overflow: hidden; }
    .btn::after { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent); opacity: 0; transition: opacity 0.3s; }
    .btn:hover::after { opacity: 1; }
    .btn:active { transform: scale(0.98); }
    .form-group { margin-bottom: 1.5rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: var(--text-secondary, #a1a1a1); }
    input[type="text"], input[type="number"], textarea, select { transition: all 0.3s ease; }
    input[type="text"]:focus, input[type="number"]:focus, textarea:focus, select:focus { border-color: var(--accent, #d4ff3a) !important; box-shadow: 0 0 0 3px rgba(212, 255, 58, 0.2) !important; outline: none; }
    .password-display, .result-display { display: flex; gap: 0.5rem; align-items: stretch; }
    .password-display input, .result-display input, .result-display textarea { flex: 1; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .loading { animation: pulse 1.5s infinite; }
  </style>
  <script>
    function showToast(msg = 'Copied!') {
      let toast = document.querySelector('.copy-toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.className = 'copy-toast';
        document.body.appendChild(toast);
      }
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }
    function copyText(text) {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => showToast('Copied!')).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }
    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('Copied!');
    }
  </script>
<script src="https://quge5.com/88/tag.min.js" data-zone="198117" async data-cfasync="false"></script>
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="../index.html" class="nav-brand">ToolsKita</a>
    </div>
  </nav>

  <main class="tool-page">
    <div class="container">
      <div class="tool-header">
        <h1>⭕ Border Radius Generator</h1>
        <p>Create custom border radius for any corner</p>
      </div>

      <div class="tool-content">
        <div class="radius-preview" id="preview">Preview</div>

        <div class="form-group">
          <label>
            <input type="checkbox" id="allCorners" checked onchange="toggleAllCorners()"> 
            Apply to all corners
          </label>
        </div>

        <div class="corner-controls">
          <div class="form-group">
            <label for="topLeft">Top Left: <span id="tlValue">20</span>px</label>
            <input type="range" id="topLeft" min="0" max="150" value="20" oninput="updateRadius()">
          </div>

          <div class="form-group">
            <label for="topRight">Top Right: <span id="trValue">20</span>px</label>
            <input type="range" id="topRight" min="0" max="150" value="20" oninput="updateRadius()">
          </div>

          <div class="form-group">
            <label for="bottomLeft">Bottom Left: <span id="blValue">20</span>px</label>
            <input type="range" id="bottomLeft" min="0" max="150" value="20" oninput="updateRadius()">
          </div>

          <div class="form-group">
            <label for="bottomRight">Bottom Right: <span id="brValue">20</span>px</label>
            <input type="range" id="bottomRight" min="0" max="150" value="20" oninput="updateRadius()">
          </div>
        </div>

        <h3 style="margin-top: var(--space-8); margin-bottom: var(--space-4);">Presets:</h3>
        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: var(--space-3); margin-bottom: var(--space-6);">
          <div style="width: 100px; height: 100px; background: var(--accent); border-radius: 0; cursor: pointer;" onclick="applyPreset(0,0,0,0)"></div>
          <div style="width: 100px; height: 100px; background: var(--accent); border-radius: 10px; cursor: pointer;" onclick="applyPreset(10,10,10,10)"></div>
          <div style="width: 100px; height: 100px; background: var(--accent); border-radius: 20px; cursor: pointer;" onclick="applyPreset(20,20,20,20)"></div>
          <div style="width: 100px; height: 100px; background: var(--accent); border-radius: 50%; cursor: pointer;" onclick="applyPreset(150,150,150,150)"></div>
          <div style="width: 100px; height: 100px; background: var(--accent); border-radius: 50px 10px 50px 10px; cursor: pointer;" onclick="applyPreset(50,10,10,50)"></div>
          <div style="width: 100px; height: 100px; background: var(--accent); border-radius: 80px 10px; cursor: pointer;" onclick="applyPreset(80,10,80,10)"></div>
        </div>

        <div class="form-group">
          <label>CSS Code:</label>
          <textarea id="cssOutput" rows="3" readonly></textarea>
        </div>

        <button class="btn btn-primary" style="width: 100%;" onclick="copyCSS()">
          📋 Copy CSS
        </button>
      </div>
    </div>
  </main>

  <script>
    function toggleAllCorners() {
      const allCorners = document.getElementById('allCorners').checked;
      const inputs = ['topRight', 'bottomLeft', 'bottomRight'];
      
      if (allCorners) {
        const topLeft = document.getElementById('topLeft').value;
        inputs.forEach(id => {
          document.getElementById(id).value = topLeft;
          document.getElementById(id).disabled = true;
        });
      } else {
        inputs.forEach(id => {
          document.getElementById(id).disabled = false;
        });
      }
      updateRadius();
    }

    function updateRadius() {
      const allCorners = document.getElementById('allCorners').checked;
      const tl = document.getElementById('topLeft').value;
      const tr = allCorners ? tl : document.getElementById('topRight').value;
      const bl = allCorners ? tl : document.getElementById('bottomLeft').value;
      const br = allCorners ? tl : document.getElementById('bottomRight').value;

      document.getElementById('tlValue').textContent = tl;
      document.getElementById('trValue').textContent = tr;
      document.getElementById('blValue').textContent = bl;
      document.getElementById('brValue').textContent = br;

      const preview = document.getElementById('preview');
      preview.style.borderRadius = `${tl}px ${tr}px ${br}px ${bl}px`;

      let css;
      if (tl === tr && tr === br && br === bl) {
        css = `border-radius: ${tl}px;`;
      } else {
        css = `border-radius: ${tl}px ${tr}px ${br}px ${bl}px;`;
      }

      document.getElementById('cssOutput').value = css;
    }

    function applyPreset(tl, tr, br, bl) {
      document.getElementById('allCorners').checked = false;
      document.getElementById('topLeft').value = tl;
      document.getElementById('topRight').value = tr;
      document.getElementById('bottomRight').value = br;
      document.getElementById('bottomLeft').value = bl;
      
      ['topRight', 'bottomLeft', 'bottomRight'].forEach(id => {
        document.getElementById(id).disabled = false;
      });
      
      updateRadius();
    }

    function copyCSS() {
      const css = document.getElementById('cssOutput');
      css.select();
      document.execCommand('copy');
      event.target.textContent = '✓ Copied!';
      setTimeout(() => {
        event.target.textContent = '📋 Copy CSS';
      }, 2000);
    }

    window.onload = updateRadius;
  </script>

</body>
</html>
