<head>

  <!-- tool-improved-v2 -->
  <style>
    .copy-toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: linear-gradient(135deg, #22c55e, #16a34a); color: white; padding: 12px 24px; border-radius: 12px; font-weight: 600; opacity: 0; transition: all 0.3s ease; z-index: 9999; box-shadow: 0 10px 40px rgba(34, 197, 94, 0.4); }
    .copy-toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .btn { position: relative; overflow: hidden; }
    .btn::after { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent); opacity: 0; transition: opacity 0.3s; }
    .btn:hover::after { opacity: 1; }
    .btn:active { transform: scale(0.98); }
    .form-group { margin-bottom: 1.5rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: var(--text-secondary, #a1a1a1); }
    input[type="text"], input[type="number"], textarea, select { transition: all 0.3s ease; }
    input[type="text"]:focus, input[type="number"]:focus, textarea:focus, select:focus { border-color: var(--accent, #d4ff3a) !important; box-shadow: 0 0 0 3px rgba(212, 255, 58, 0.2) !important; outline: none; }
    .password-display, .result-display { display: flex; gap: 0.5rem; align-items: stretch; }
    .password-display input, .result-display input, .result-display textarea { flex: 1; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .loading { animation: pulse 1.5s infinite; }
  </style>
  <script>
    function showToast(msg = 'Copied!') {
      let toast = document.querySelector('.copy-toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.className = 'copy-toast';
        document.body.appendChild(toast);
      }
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }
    function copyText(text) {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => showToast('Copied!')).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }
    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('Copied!');
    }
  </script>
<script src="https://quge5.com/88/tag.min.js" data-zone="198117" async data-cfasync="false"></script>
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="../index.html" class="nav-brand">ToolsKita</a>
    </div>
  </nav>

  <main class="tool-page">
    <div class="container">
      <div class="tool-header">
        <h1>🧾 Kalkulator PPN (Pajak Pertambahan Nilai)</h1>
        <p>Hitung harga bersih, jumlah pajak, dan harga kotor dengan mudah.</p>
      </div>

      <div class="tool-content">
        <div class="form-group">
          <label>Harga yang saya masukkan adalah:</label>
          <div class="radio-group">
             <label><input type="radio" name="priceType" value="before" checked onchange="calculate()"> Harga SEBELUM Pajak</label>
             <label><input type="radio" name="priceType" value="after" onchange="calculate()"> Harga SETELAH Pajak</label>
          </div>
        </div>

        <div class="form-group">
          <label for="initialPrice">Jumlah Harga (Rp):</label>
          <input type="number" id="initialPrice" placeholder="e.g., 100000" oninput="calculate()">
        </div>

        <div class="form-group">
          <label for="taxRate">Tarif Pajak (%):</label>
          <input type="number" id="taxRate" value="11" oninput="calculate()">
        </div>

        <hr style="margin: 2rem 0;">

        <h3>Hasil Kalkulasi:</h3>
        <div class="form-group">
          <label for="priceBeforeTax">Harga Sebelum Pajak (Net):</label>
          <input type="text" id="priceBeforeTax" readonly>
        </div>
        <div class="form-group">
          <label for="taxAmount">Jumlah Pajak:</label>
          <input type="text" id="taxAmount" readonly>
        </div>
        <div class="form-group">
          <label for="priceAfterTax">Harga Setelah Pajak (Gross):</label>
          <input type="text" id="priceAfterTax" readonly>
        </div>

      </div>
    </div>
  </main>

  <script>
    const priceType = document.getElementsByName('priceType');
    const initialPriceInput = document.getElementById('initialPrice');
    const taxRateInput = document.getElementById('taxRate');
    const priceBeforeTaxOutput = document.getElementById('priceBeforeTax');
    const taxAmountOutput = document.getElementById('taxAmount');
    const priceAfterTaxOutput = document.getElementById('priceAfterTax');

    function formatCurrency(value) {
      if (isNaN(value) || value === 0) return 'Rp 0';
      return 'Rp ' + value.toFixed(2).replace(/\d(?=(\d{3})+\.)/g, '$&,').replace(/\.00$/, '');
    }

    function calculate() {
      const price = parseFloat(initialPriceInput.value) || 0;
      const rate = parseFloat(taxRateInput.value) || 0;
      const type = Array.from(priceType).find(radio => radio.checked).value;

      let netPrice = 0;
      let tax = 0;
      let grossPrice = 0;

      if (price > 0 && rate > 0) {
        if (type === 'before') {
          netPrice = price;
          tax = netPrice * (rate / 100);
          grossPrice = netPrice + tax;
        } else { // type === 'after'
          grossPrice = price;
          netPrice = grossPrice / (1 + (rate / 100));
          tax = grossPrice - netPrice;
        }
      }
      
      priceBeforeTaxOutput.value = formatCurrency(netPrice);
      taxAmountOutput.value = formatCurrency(tax);
      priceAfterTaxOutput.value = formatCurrency(grossPrice);
    }
    
    // Panggil fungsi saat halaman pertama kali dimuat
    window.onload = calculate;
  </script>
